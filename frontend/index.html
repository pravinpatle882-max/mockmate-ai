<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MockMate AI - Intelligent Interview Preparation & Performance Evaluation</title>
  
  <!-- Website Favicon Logo -->
  <link rel="icon" type="image/png" href="/src/assets/logo.png">
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Custom Mobile & Desktop Responsive Design System CSS -->
  <link rel="stylesheet" href="/src/css/style.css">
  
  <!-- Chart.js for analytics graphs -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- React 18 & ReactDOM 18 CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone compiler for in-browser JSX parsing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- API and Voice Services -->
  <script src="/src/services/api.js"></script>
  <script src="/src/services/voice.js"></script>

  <!-- Main React SPA Application script -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- SVG ICONS ---
    const IconCode = () => (
      <svg className="svg-icon" viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
    );
    const IconMic = () => (
      <svg className="svg-icon" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
    );
    const IconChart = () => (
      <svg className="svg-icon" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
    );
    const IconFile = () => (
      <svg className="svg-icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
    );
    const IconCheck = () => (
      <svg className="svg-icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
    );
    const IconUser = () => (
      <svg className="svg-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
    );
    const IconDownload = () => (
      <svg className="svg-icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
    );
    const IconClock = () => (
      <svg className="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
    );
    const IconHelp = () => (
      <svg className="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
    );
    const IconMenu = () => (
      <svg className="svg-icon" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    );

    // --- NAVIGATION BAR ---
    function Navbar({ currentPage, navigate, user, onLogout }) {
      const [menuOpen, setMenuOpen] = useState(false);

      const handleNavClick = (page) => {
        navigate(page);
        setMenuOpen(false);
      };

      return (
        <nav className="navbar">
          <div className="brand" onClick={() => handleNavClick('home')} style={{cursor: 'pointer'}}>
            <img src="/src/assets/logo.png" alt="MockMate AI Logo" className="brand-logo-img" />
            <span>MockMate AI</span>
          </div>

          <button className="mobile-menu-btn" onClick={() => setMenuOpen(!menuOpen)}>
            <IconMenu />
          </button>

          <div className={`nav-links ${menuOpen ? 'open' : ''}`}>
            <span className={`nav-item ${currentPage === 'home' ? 'active' : ''}`} onClick={() => handleNavClick('home')}>
              Home
            </span>

            {user ? (
              <>
                <span className={`nav-item ${currentPage === 'dashboard' ? 'active' : ''}`} onClick={() => handleNavClick('dashboard')}>
                  Dashboard
                </span>
                <span className={`nav-item ${currentPage === 'setup' ? 'active' : ''}`} onClick={() => handleNavClick('setup')}>
                  Start Assessment
                </span>
                <span className={`nav-item ${currentPage === 'history' ? 'active' : ''}`} onClick={() => handleNavClick('history')}>
                  History
                </span>
                <div style={{display: 'flex', alignItems: 'center', gap: '8px', marginLeft: '8px', flexWrap: 'wrap'}}>
                  <span className="badge badge-indigo">
                    <IconUser /> {user.name}
                  </span>
                  <button className="btn btn-secondary btn-sm" onClick={onLogout}>Logout</button>
                </div>
              </>
            ) : (
              <>
                <span className={`nav-item ${currentPage === 'login' ? 'active' : ''}`} onClick={() => handleNavClick('login')}>
                  Sign In
                </span>
                <button className="btn btn-primary btn-sm" onClick={() => handleNavClick('register')}>
                  Register
                </button>
              </>
            )}
          </div>
        </nav>
      );
    }

    // --- HOME PAGE ---
    function HomePage({ navigate, user }) {
      return (
        <div className="animate-fade-in">
          {/* Main Hero Header */}
          <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(290px, 1fr))', gap: '28px', alignItems: 'center', padding: '16px 0 28px'}}>
            <div>
              <div style={{display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '14px'}}>
                <img src="/src/assets/logo.png" alt="MockMate AI Logo" style={{width: '28px', height: '28px', borderRadius: '6px'}} />
                <span className="badge badge-indigo">
                  MockMate AI Assessment Platform
                </span>
              </div>
              <h1 style={{fontSize: '2.4rem', fontWeight: '800', lineHeight: '1.25', letterSpacing: '-0.5px', marginBottom: '14px', color: 'var(--text-main)'}}>
                Master Technical Interviews with MockMate AI
              </h1>
              <p style={{fontSize: '1rem', color: 'var(--text-secondary)', marginBottom: '24px', lineHeight: '1.6'}}>
                Practice domain-tailored technical assessments across Software Engineering, Data Science, AI, and System Design. Receive multi-factor evaluation scores, semantic feedback, and downloadable PDF performance certificates.
              </p>
              <div className="btn-stack-mobile" style={{display: 'flex', gap: '10px', flexWrap: 'wrap'}}>
                <button className="btn btn-primary" style={{padding: '12px 24px'}} onClick={() => navigate(user ? 'setup' : 'login')}>
                  Start Practice Assessment
                </button>
                <button className="btn btn-secondary" style={{padding: '12px 24px'}} onClick={() => navigate(user ? 'dashboard' : 'register')}>
                  View Performance Dashboard
                </button>
              </div>
            </div>

            {/* Generated Topic Illustration */}
            <div>
              <img src="/src/assets/hero.jpg" alt="MockMate AI Interviewer" className="img-card" style={{maxHeight: '280px'}} />
            </div>
          </div>

          {/* System Overview Grid */}
          <div style={{marginTop: '20px'}}>
            <h3 style={{fontSize: '1.2rem', fontWeight: '700', marginBottom: '16px', color: 'var(--text-main)'}}>
              Core MockMate AI Capabilities
            </h3>

            <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(240px, 1fr))', gap: '14px'}}>
              <div className="card card-hover">
                <div style={{color: 'var(--primary)', marginBottom: '10px'}}><IconCode /></div>
                <h4 style={{fontSize: '1rem', fontWeight: '700', marginBottom: '6px'}}>Dynamic AI Questioning</h4>
                <p style={{color: 'var(--text-secondary)', fontSize: '0.85rem'}}>
                  Questions are generated dynamically based on selected difficulty, domain, and candidate skills extracted from uploaded PDF resumes.
                </p>
              </div>

              <div className="card card-hover">
                <div style={{color: 'var(--cyan)', marginBottom: '10px'}}><IconMic /></div>
                <h4 style={{fontSize: '1rem', fontWeight: '700', marginBottom: '6px'}}>Voice & Text Response Modes</h4>
                <p style={{color: 'var(--text-secondary)', fontSize: '0.85rem'}}>
                  Support both typed technical answers and spoken verbal responses with real-time speech-to-text transcription preview.
                </p>
              </div>

              <div className="card card-hover">
                <div style={{color: 'var(--emerald)', marginBottom: '10px'}}><IconChart /></div>
                <h4 style={{fontSize: '1rem', fontWeight: '700', marginBottom: '6px'}}>Semantic Vector Evaluation</h4>
                <p style={{color: 'var(--text-secondary)', fontSize: '0.85rem'}}>
                  Evaluates answers using Sentence Transformer vector embeddings and multi-factor scoring (Technical, Accuracy, Relevance, Grammar, Communication).
                </p>
              </div>

              <div className="card card-hover">
                <div style={{color: 'var(--amber)', marginBottom: '10px'}}><IconFile /></div>
                <h4 style={{fontSize: '1rem', fontWeight: '700', marginBottom: '6px'}}>Resume Skill Parser</h4>
                <p style={{color: 'var(--text-secondary)', fontSize: '0.85rem'}}>
                  Parses PDF resumes to extract candidate technical skill profiles (Python, React, SQL, AWS, DSA) for targeted questioning.
                </p>
              </div>
            </div>
          </div>

          {/* Workflow Sequence */}
          <div className="card" style={{marginTop: '28px', padding: '24px'}}>
            <h3 style={{fontSize: '1.1rem', fontWeight: '700', marginBottom: '20px', textAlign: 'center'}}>
              Assessment Process Flow
            </h3>
            
            <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: '16px'}}>
              <div style={{textAlign: 'center'}}>
                <div className="badge badge-slate" style={{marginBottom: '8px', fontSize: '0.8rem'}}>Step 1</div>
                <h5 style={{fontSize: '0.9rem', fontWeight: '700', marginBottom: '4px'}}>Configure Setup</h5>
                <p style={{fontSize: '0.8rem', color: 'var(--text-muted)'}}>Select domain, difficulty level, and response format.</p>
              </div>

              <div style={{textAlign: 'center'}}>
                <div className="badge badge-slate" style={{marginBottom: '8px', fontSize: '0.8rem'}}>Step 2</div>
                <h5 style={{fontSize: '0.9rem', fontWeight: '700', marginBottom: '4px'}}>Answer Questions</h5>
                <p style={{fontSize: '0.8rem', color: 'var(--text-muted)'}}>Submit typed or voice answers under timed interview conditions.</p>
              </div>

              <div style={{textAlign: 'center'}}>
                <div className="badge badge-slate" style={{marginBottom: '8px', fontSize: '0.8rem'}}>Step 3</div>
                <h5 style={{fontSize: '0.9rem', fontWeight: '700', marginBottom: '4px'}}>AI Evaluation</h5>
                <p style={{fontSize: '0.8rem', color: 'var(--text-muted)'}}>Semantic transformer analysis rates technical depth & accuracy.</p>
              </div>

              <div style={{textAlign: 'center'}}>
                <div className="badge badge-slate" style={{marginBottom: '8px', fontSize: '0.8rem'}}>Step 4</div>
                <h5 style={{fontSize: '0.9rem', fontWeight: '700', marginBottom: '4px'}}>Download Report</h5>
                <p style={{fontSize: '0.8rem', color: 'var(--text-muted)'}}>Review competency breakdown and export official PDF certificate.</p>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- LOGIN PAGE ---
    function LoginPage({ navigate, onLoginSuccess }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError('');
        try {
          await window.api.login(email, password);
          onLoginSuccess();
          navigate('dashboard');
        } catch (err) {
          setError(err.message || 'Invalid email or password');
        } finally {
          setLoading(false);
        }
      };

      const handleDemoLogin = async () => {
        setLoading(true);
        setError('');
        try {
          try {
            await window.api.login('student@example.com', 'password123');
          } catch (e) {
            await window.api.register('Candidate Demo', 'student@example.com', 'password123');
          }
          onLoginSuccess();
          navigate('dashboard');
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="animate-fade-in" style={{maxWidth: '380px', margin: '30px auto'}}>
          <div className="card">
            <div style={{textAlign: 'center', marginBottom: '14px'}}>
              <img src="/src/assets/logo.png" alt="MockMate AI Logo" style={{width: '48px', height: '48px', borderRadius: '10px'}} />
            </div>
            <h2 style={{fontSize: '1.4rem', fontWeight: '800', marginBottom: '4px', textAlign: 'center'}}>Candidate Sign In</h2>
            <p style={{color: 'var(--text-secondary)', fontSize: '0.85rem', textAlign: 'center', marginBottom: '18px'}}>
              Sign in to MockMate AI to manage candidate assessments
            </p>

            {error && (
              <div style={{padding: '10px', background: 'rgba(244,63,94,0.1)', border: '1px solid rgba(244,63,94,0.3)', color: '#fca5a5', borderRadius: '6px', fontSize: '0.85rem', marginBottom: '14px'}}>
                {error}
              </div>
            )}

            <form onSubmit={handleSubmit}>
              <div className="form-group">
                <label>Email Address</label>
                <input type="email" className="form-input" placeholder="candidate@example.com" value={email} onChange={e => setEmail(e.target.value)} required />
              </div>

              <div className="form-group">
                <label>Password</label>
                <input type="password" className="form-input" placeholder="••••••••" value={password} onChange={e => setPassword(e.target.value)} required />
              </div>

              <button type="submit" className="btn btn-primary" style={{width: '100%', marginTop: '6px'}} disabled={loading}>
                {loading ? 'Authenticating...' : 'Sign In'}
              </button>

              <button type="button" className="btn btn-secondary" style={{width: '100%', marginTop: '10px'}} onClick={handleDemoLogin} disabled={loading}>
                Quick Demo User Sign In
              </button>
            </form>

            <div style={{textAlign: 'center', marginTop: '16px', fontSize: '0.85rem', color: 'var(--text-secondary)'}}>
              Don't have an account? <span style={{color: '#818cf8', cursor: 'pointer', fontWeight: '600'}} onClick={() => navigate('register')}>Register</span>
            </div>
          </div>
        </div>
      );
    }

    // --- REGISTER PAGE ---
    function RegisterPage({ navigate, onLoginSuccess }) {
      const [name, setName] = useState('');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [confirmPassword, setConfirmPassword] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (password !== confirmPassword) {
          setError("Passwords do not match");
          return;
        }
        setLoading(true);
        setError('');
        try {
          await window.api.register(name, email, password);
          onLoginSuccess();
          navigate('dashboard');
        } catch (err) {
          setError(err.message || 'Registration failed');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="animate-fade-in" style={{maxWidth: '400px', margin: '30px auto'}}>
          <div className="card">
            <div style={{textAlign: 'center', marginBottom: '14px'}}>
              <img src="/src/assets/logo.png" alt="MockMate AI Logo" style={{width: '48px', height: '48px', borderRadius: '10px'}} />
            </div>
            <h2 style={{fontSize: '1.4rem', fontWeight: '800', marginBottom: '4px', textAlign: 'center'}}>Create Account</h2>
            <p style={{color: 'var(--text-secondary)', fontSize: '0.85rem', textAlign: 'center', marginBottom: '18px'}}>
              Register a new account on MockMate AI
            </p>

            {error && (
              <div style={{padding: '10px', background: 'rgba(244,63,94,0.1)', border: '1px solid rgba(244,63,94,0.3)', color: '#fca5a5', borderRadius: '6px', fontSize: '0.85rem', marginBottom: '14px'}}>
                {error}
              </div>
            )}

            <form onSubmit={handleSubmit}>
              <div className="form-group">
                <label>Full Name</label>
                <input type="text" className="form-input" placeholder="John Doe" value={name} onChange={e => setName(e.target.value)} required />
              </div>

              <div className="form-group">
                <label>Email Address</label>
                <input type="email" className="form-input" placeholder="candidate@example.com" value={email} onChange={e => setEmail(e.target.value)} required />
              </div>

              <div className="form-group">
                <label>Password</label>
                <input type="password" className="form-input" placeholder="••••••••" value={password} onChange={e => setPassword(e.target.value)} required />
              </div>

              <div className="form-group">
                <label>Confirm Password</label>
                <input type="password" className="form-input" placeholder="••••••••" value={confirmPassword} onChange={e => setConfirmPassword(e.target.value)} required />
              </div>

              <button type="submit" className="btn btn-primary" style={{width: '100%', marginTop: '6px'}} disabled={loading}>
                {loading ? 'Registering...' : 'Register Account'}
              </button>
            </form>

            <div style={{textAlign: 'center', marginTop: '16px', fontSize: '0.85rem', color: 'var(--text-secondary)'}}>
              Already have an account? <span style={{color: '#818cf8', cursor: 'pointer', fontWeight: '600'}} onClick={() => navigate('login')}>Sign In</span>
            </div>
          </div>
        </div>
      );
    }

    // --- DASHBOARD PAGE ---
    function DashboardPage({ navigate, onSelectInterview }) {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [uploading, setUploading] = useState(false);
      const [uploadMsg, setUploadMsg] = useState('');
      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      const loadDashboard = async () => {
        setLoading(true);
        try {
          const res = await window.api.getDashboardData();
          setData(res);
        } catch (err) {
          console.error(err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        loadDashboard();
      }, []);

      useEffect(() => {
        if (data && data.score_trends && data.score_trends.length > 0 && chartRef.current) {
          if (chartInstance.current) {
            chartInstance.current.destroy();
          }
          const ctx = chartRef.current.getContext('2d');
          chartInstance.current = new Chart(ctx, {
            type: 'line',
            data: {
              labels: data.score_trends.map(t => t.date),
              datasets: [{
                label: 'Assessment Overall Score (0-10)',
                data: data.score_trends.map(t => t.score),
                borderColor: '#6366f1',
                backgroundColor: 'rgba(99, 102, 241, 0.1)',
                borderWidth: 2,
                fill: true,
                tension: 0.2,
                pointBackgroundColor: '#4f46e5',
                pointRadius: 4
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              scales: {
                y: { min: 0, max: 10, grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#9ca3af' } },
                x: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#9ca3af' } }
              },
              plugins: {
                legend: { labels: { color: '#f9fafc', font: { family: 'Inter', size: 12 } } }
              }
            }
          });
        }
      }, [data]);

      const handleFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setUploading(true);
        setUploadMsg('');
        try {
          const res = await window.api.uploadResume(file);
          setUploadMsg(`Parsed resume successfully. Extracted ${res.extracted_skills.length} technical skills.`);
          loadDashboard();
        } catch (err) {
          setUploadMsg(`Upload failed: ${err.message}`);
        } finally {
          setUploading(false);
        }
      };

      if (loading) {
        return (
          <div style={{display: 'flex', justifyContent: 'center', alignItems: 'center', height: '240px', flexDirection: 'column', gap: '12px'}}>
            <div className="spinner-std"></div>
            <div style={{color: 'var(--text-muted)', fontSize: '0.9rem'}}>Loading Dashboard Data...</div>
          </div>
        );
      }

      return (
        <div className="animate-fade-in">
          {/* Header */}
          <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px', flexWrap: 'wrap', gap: '14px'}}>
            <div>
              <h1 style={{fontSize: '1.65rem', fontWeight: '800', letterSpacing: '-0.3px'}}>Performance Dashboard</h1>
              <p style={{color: 'var(--text-secondary)', fontSize: '0.85rem'}}>
                Candidate interview readiness and historical evaluation insights
              </p>
            </div>
            <button className="btn btn-primary" onClick={() => navigate('setup')}>
              Start New Assessment
            </button>
          </div>

          {/* Key Indicators Grid */}
          <div className="kpi-grid">
            <div className="kpi-card">
              <div className="kpi-title">Total Assessments</div>
              <div className="kpi-value">{data.total_interviews}</div>
            </div>

            <div className="kpi-card">
              <div className="kpi-title">Average Score</div>
              <div className="kpi-value">
                {data.average_score.toFixed(1)} <span style={{fontSize: '0.95rem', color: 'var(--text-muted)', fontWeight: '500'}}>/ 10</span>
              </div>
            </div>

            <div className="kpi-card">
              <div className="kpi-title">Best Score</div>
              <div className="kpi-value" style={{color: '#6ee7b7'}}>
                {data.best_score.toFixed(1)} <span style={{fontSize: '0.95rem', color: 'var(--text-muted)', fontWeight: '500'}}>/ 10</span>
              </div>
            </div>

            <div className="kpi-card">
              <div className="kpi-title">Extracted Skills</div>
              <div className="kpi-value">{data.extracted_skills.length}</div>
            </div>
          </div>

          {/* Resume Banner with Topic Illustration */}
          <div className="card" style={{marginBottom: '20px'}}>
            <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(260px, 1fr))', gap: '16px', alignItems: 'center'}}>
              <div>
                <h4 style={{fontSize: '0.95rem', fontWeight: '700', marginBottom: '4px'}}>Resume Profile Customization</h4>
                <p style={{color: 'var(--text-secondary)', fontSize: '0.825rem', marginBottom: '10px'}}>
                  Upload candidate PDF resume to generate skill-targeted technical questions matching candidate background.
                </p>
                
                <label className="btn btn-secondary btn-sm" style={{cursor: 'pointer', marginBottom: '10px'}}>

    // --- SETUP PAGE ---

    // --- INTERVIEW PAGE ---
    function InterviewPage({ interviewData, navigate, onCompleteInterview }) {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [answerText, setAnswerText] = useState('');
      const [isRecording, setIsRecording] = useState(false);
      const [transcriptionMsg, setTranscriptionMsg] = useState('');
      const [timerSeconds, setTimerSeconds] = useState(180);
      const [submitting, setSubmitting] = useState(false);
      const [showHint, setShowHint] = useState(false);

      const questions = interviewData ? interviewData.questions : [];
      const currentQuestion = questions[currentIndex] || {};

      useEffect(() => {
        setTimerSeconds(180);
        setShowHint(false);
        const interval = setInterval(() => {
          setTimerSeconds(prev => (prev > 0 ? prev - 1 : 0));
        }, 1000);
        return () => clearInterval(interval);
      }, [currentIndex]);

      const formatTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${m}:${s < 10 ? '0' : ''}${s}`;
      };

      const handleMicToggle = async () => {
        if (!isRecording) {
          setIsRecording(true);
          setTranscriptionMsg('Recording audio... Speak clearly into your microphone.');
          window.voiceService.startRecording(
            (transcript) => {
              setAnswerText(prev => (prev ? prev + ' ' + transcript : transcript));
            },
            (err) => {
              setTranscriptionMsg(err);
              setIsRecording(false);
            }
          );
        } else {
          setIsRecording(false);
          setTranscriptionMsg('Processing transcription...');
          const audioBlob = await window.voiceService.stopRecording();
          if (audioBlob) {
            try {
              const res = await window.api.transcribeSpeech(audioBlob);
              if (res.text && res.text.trim()) {
                setAnswerText(prev => (prev ? prev + '\n' + res.text : res.text));
                setTranscriptionMsg('Transcription completed.');
              }
            } catch (e) {
              setTranscriptionMsg('Transcribed response.');
            }
          }
        }
      };

      const handleNextSubmit = async () => {
        if (!answerText.trim()) {
          alert('Please provide an answer before submitting.');
          return;
        }

        setSubmitting(true);
        try {
          await window.api.submitAnswer(
            interviewData.interview_id,
            currentQuestion.id,
            answerText
          );

          setAnswerText('');
          setTranscriptionMsg('');

          if (currentIndex + 1 < questions.length) {
            setCurrentIndex(prev => prev + 1);
          } else {
            await window.api.completeInterview(interviewData.interview_id);
            onCompleteInterview(interviewData.interview_id);
            navigate('result');
          }
        } catch (err) {
          alert(`Submission error: ${err.message}`);
        } finally {
          setSubmitting(false);
        }
      };

      if (!interviewData || questions.length === 0) {
        return (
          <div style={{textAlign: 'center', padding: '60px'}}>
            <h3>No active interview session found.</h3>
            <button className="btn btn-primary" style={{marginTop: '12px'}} onClick={() => navigate('setup')}>Setup Session</button>
          </div>
        );
      }

      const progressPct = ((currentIndex + 1) / questions.length) * 100;

      return (
        <div className="animate-fade-in" style={{maxWidth: '780px', margin: '0 auto'}}>
          {/* Header Track */}
          <div className="card" style={{marginBottom: '14px', padding: '14px 16px'}}>
            <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '8px', flexWrap: 'wrap', gap: '8px'}}>
              <div>
                <span className="badge badge-indigo">{interviewData.domain}</span>
                <span className="badge badge-slate" style={{marginLeft: '4px'}}>{interviewData.difficulty}</span>
                <span className="badge badge-slate" style={{marginLeft: '4px'}}>{interviewData.mode}</span>
              </div>

              <div style={{display: 'flex', alignItems: 'center', gap: '12px', fontSize: '0.825rem'}}>
                <div style={{fontWeight: '700', color: timerSeconds < 30 ? '#f43f5e' : 'var(--text-main)'}}>
                  <IconClock /> {formatTime(timerSeconds)}
                </div>
                <div style={{color: 'var(--text-secondary)'}}>
                  Question {currentIndex + 1} of {questions.length}
                </div>
              </div>
            </div>

            <div className="progress-track">
              <div className="progress-fill" style={{width: `${progressPct}%`}}></div>
            </div>
          </div>

          {/* Question Card */}
          <div className="card">
            <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '6px'}}>
              <span style={{fontSize: '0.75rem', color: 'var(--text-muted)', textTransform: 'uppercase', fontWeight: '700'}}>
                QUESTION {currentIndex + 1} OF {questions.length}
              </span>

              <button
                className="btn btn-outline btn-sm"
                style={{padding: '4px 8px', fontSize: '0.75rem'}}
                onClick={() => setShowHint(!showHint)}
              >
                <IconHelp /> {showHint ? 'Hide Response Guide' : 'Response Structure Guide'}
              </button>
            </div>

            <h3 style={{fontSize: '1.2rem', fontWeight: '700', lineHeight: '1.4', marginBottom: '14px'}}>
              {currentQuestion.question}
            </h3>

            {/* Answer Structure Guide Accordion */}
            {showHint && (
              <div style={{padding: '10px 12px', background: 'rgba(99,102,241,0.08)', border: '1px solid rgba(99,102,241,0.2)', borderRadius: '8px', marginBottom: '14px', fontSize: '0.8rem', color: 'var(--text-secondary)'}}>
                <b style={{color: '#a5b4fc'}}>💡 High-Scoring Technical Answer Structure:</b>
                <ul style={{paddingLeft: '16px', marginTop: '4px'}}>
                  <li>1. State clear definition/core concept directly.</li>
                  <li>2. Explain key components, mechanics, or architectural trade-offs.</li>
                  <li>3. Give a real-world scenario or technical code example.</li>
                </ul>
              </div>
            )}

            <div className="form-group">
              <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '4px'}}>
                <label>Candidate Answer</label>
                <span style={{fontSize: '0.75rem', color: 'var(--text-muted)'}}>
                  {answerText.split(/\s+/).filter(Boolean).length} words
                </span>
              </div>

              <textarea
                className="form-textarea"
                rows="7"
                placeholder="Type your technical response here..."
                value={answerText}
                onChange={e => setAnswerText(e.target.value)}
              />
            </div>

            {interviewData.mode === 'Voice' && (
              <div style={{display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '8px', margin: '14px 0'}}>
                <button className={`mic-btn-std ${isRecording ? 'recording' : ''}`} onClick={handleMicToggle}>
                  <IconMic />
                </button>
                
                {isRecording && (
                  <div className="sound-wave-container">
                    <div className="sound-bar"></div>
                    <div className="sound-bar"></div>
                    <div className="sound-bar"></div>
                    <div className="sound-bar"></div>
                    <div className="sound-bar"></div>
                  </div>
                )}

                <div style={{fontSize: '0.8rem', color: isRecording ? '#f43f5e' : 'var(--text-muted)'}}>
                  {isRecording ? 'Recording audio... Click button to finish speech' : 'Click microphone button to record verbal answer'}
                </div>
                {transcriptionMsg && (
                  <div style={{fontSize: '0.8rem', color: '#67e8f9'}}>
                    {transcriptionMsg}
                  </div>
                )}
              </div>
            )}

            <div style={{display: 'flex', justifyContent: 'flex-end', marginTop: '14px'}}>
              <button className="btn btn-emerald" onClick={handleNextSubmit} disabled={submitting}>
                {submitting ? 'Evaluating...' : (currentIndex + 1 < questions.length ? 'Submit Answer' : 'Finalize Assessment')}
              </button>
            </div>
          </div>
        </div>
      );
    }

              <h4 style={{fontSize: '0.85rem', color: '#6ee7b7', marginBottom: '6px'}}>Candidate Strengths</h4>
              <ul style={{paddingLeft: '16px', fontSize: '0.8rem', color: 'var(--text-secondary)'}}>
                {result.strengths.map((s, i) => <li key={i} style={{marginBottom: '3px'}}>{s}</li>)}
              </ul>
            </div>

            <div className="card" style={{borderLeft: '3px solid #f43f5e'}}>
              <h4 style={{fontSize: '0.85rem', color: '#fca5a5', marginBottom: '6px'}}>Areas for Growth</h4>
              <ul style={{paddingLeft: '16px', fontSize: '0.8rem', color: 'var(--text-secondary)'}}>
                {result.weaknesses.map((w, i) => <li key={i} style={{marginBottom: '3px'}}>{w}</li>)}
              </ul>
            </div>
          </div>

          {/* AI Recommendations */}
          <div className="card" style={{marginBottom: '18px', borderLeft: '3px solid #06b6d4'}}>
            <h4 style={{fontSize: '0.85rem', color: '#67e8f9', marginBottom: '6px'}}>MockMate AI Recommendations</h4>
            <ul style={{paddingLeft: '16px', fontSize: '0.8rem', color: 'var(--text-secondary)'}}>
              {result.suggestions.map((sug, i) => <li key={i} style={{marginBottom: '4px'}}>{sug}</li>)}
            </ul>
          </div>

          {/* Question Breakdown */}
          <div className="card">
            <h4 style={{fontSize: '0.9rem', fontWeight: '700', marginBottom: '12px'}}>Question Breakdown</h4>
            {result.responses.map((resp, idx) => {
              const qObj = result.questions.find(q => q.id === resp.question_id) || {};
              return (
                <div key={idx} style={{padding: '10px 12px', background: '#0d1322', borderRadius: '8px', marginBottom: '10px', border: '1px solid var(--border-subtle)'}}>
                  <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '4px'}}>
                    <h5 style={{fontSize: '0.85rem', fontWeight: '700'}}>Q{idx+1}: {qObj.question}</h5>
                    <span className="badge badge-emerald">Score: {resp.overall} / 10</span>
                  </div>

                  <div style={{fontSize: '0.8rem', color: 'var(--text-secondary)', marginBottom: '4px'}}>
                    <b>Candidate Response:</b> "{resp.answer}"
                  </div>

                  <div style={{fontSize: '0.8rem', color: '#a5b4fc', marginBottom: '4px'}}>
                    <b>Reference Answer:</b> "{qObj.expected_answer}"
                  </div>

                  <div style={{fontSize: '0.8rem', color: '#67e8f9'}}>
                    <b>AI Feedback:</b> {resp.feedback} (Semantic Similarity: {Math.round((resp.semantic_similarity || 0) * 100)}%)
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // --- HISTORY PAGE ---
    function HistoryPage({ navigate, onSelectInterview }) {
      const [history, setHistory] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        window.api.getInterviewHistory()
          .then(res => setHistory(res))
          .catch(err => console.error(err))
          .finally(() => setLoading(false));
      }, []);

      if (loading) {
        return (
          <div style={{display: 'flex', justifyContent: 'center', alignItems: 'center', height: '240px', flexDirection: 'column', gap: '12px'}}>
            <div className="spinner-std"></div>
            <div style={{color: 'var(--text-muted)', fontSize: '0.9rem'}}>Loading Archive...</div>
          </div>
        );
      }

      return (
        <div className="animate-fade-in" style={{maxWidth: '960px', margin: '0 auto'}}>
          <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '18px', flexWrap: 'wrap', gap: '10px'}}>
            <div>
              <h1 style={{fontSize: '1.65rem', fontWeight: '800'}}>Assessment History</h1>
              <p style={{color: 'var(--text-secondary)', fontSize: '0.85rem'}}>Archive of past candidate interview sessions</p>
            </div>
            <button className="btn btn-primary" onClick={() => navigate('setup')}>Start New Assessment</button>
          </div>

          <div className="card">
            {history.length > 0 ? (
              <div className="data-table-container">
                <table className="data-table">
                  <thead>
                    <tr>
                      <th>ID</th>
                      <th>Date</th>
                      <th>Domain</th>
                      <th>Difficulty</th>
                      <th>Mode</th>
                      <th>Questions</th>
                      <th>Score</th>
                      <th>Action</th>
                    </tr>
                  </thead>
                  <tbody>
                    {history.map((item) => (
                      <tr key={item.id}>
                        <td>#{item.id}</td>
                        <td>{new Date(item.created_at).toLocaleDateString()}</td>
                        <td><span className="badge badge-slate">{item.domain}</span></td>
                        <td><span className="badge badge-slate">{item.difficulty}</span></td>
                        <td>{item.mode}</td>
                        <td>{item.questions_count}</td>
                        <td style={{fontWeight: '700', color: item.total_score >= 7 ? '#6ee7b7' : '#fcd34d'}}>
                          {item.total_score.toFixed(1)} / 10
                        </td>
                        <td>
                          <button className="btn btn-secondary btn-sm" onClick={() => { onSelectInterview(item.id); navigate('result'); }}>
                            View Report
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            ) : (
              <div style={{textAlign: 'center', padding: '24px', color: 'var(--text-muted)', fontSize: '0.85rem'}}>
                No past interview records found.
              </div>
            )}
          </div>
        </div>
      );
    }

    // --- MAIN APP COMPONENT ---
    function App() {
      const [currentPage, setCurrentPage] = useState('home');
      const [user, setUser] = useState(window.api.getUser());
      const [activeInterviewData, setActiveInterviewData] = useState(null);
      const [selectedResultId, setSelectedResultId] = useState(null);

      useEffect(() => {
        const handleAuthChanged = () => {
          setUser(window.api.getUser());
        };
        window.addEventListener('auth-changed', handleAuthChanged);
        return () => window.removeEventListener('auth-changed', handleAuthChanged);
      }, []);

      const handleLogout = () => {
        window.api.clearAuth();
        setUser(null);
        setCurrentPage('home');
      };

      const navigate = (page) => {
        setCurrentPage(page);
        window.scrollTo(0, 0);
      };

      return (
        <div>
          <Navbar currentPage={currentPage} navigate={navigate} user={user} onLogout={handleLogout} />
          
          <main className="app-container">
            {currentPage === 'home' && <HomePage navigate={navigate} user={user} />}
            {currentPage === 'login' && <LoginPage navigate={navigate} onLoginSuccess={() => setUser(window.api.getUser())} />}
            {currentPage === 'register' && <RegisterPage navigate={navigate} onLoginSuccess={() => setUser(window.api.getUser())} />}
            {currentPage === 'dashboard' && <DashboardPage navigate={navigate} onSelectInterview={(id) => setSelectedResultId(id)} />}
            {currentPage === 'setup' && <SetupPage navigate={navigate} onStartInterview={(data) => setActiveInterviewData(data)} />}
            {currentPage === 'interview' && <InterviewPage interviewData={activeInterviewData} navigate={navigate} onCompleteInterview={(id) => setSelectedResultId(id)} />}
            {currentPage === 'result' && <ResultPage interviewId={selectedResultId} navigate={navigate} />}
            {currentPage === 'history' && <HistoryPage navigate={navigate} onSelectInterview={(id) => setSelectedResultId(id)} />}
          </main>
        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
