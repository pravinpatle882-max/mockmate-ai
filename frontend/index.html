<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MockMate Grand Hotel - Vintage Candidate Evaluation & Concierge</title>
  
  <!-- Website Favicon Logo -->
  <link rel="icon" type="image/png" href="/src/assets/logo.png">
  
  <!-- Custom Vintage Grand Hotel CSS -->
  <link rel="stylesheet" href="/src/css/style.css">
  
  <!-- Chart.js for analytics graphs -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- React 18 & ReactDOM 18 CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone compiler for in-browser JSX parsing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- API and Voice Services -->
  <script src="/src/services/api.js"></script>
  <script src="/src/services/voice.js"></script>

  <!-- Main React SPA Application script -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- VINTAGE SVG ICONS ---
    const IconKey = () => (
      <svg className="svg-icon key-swing" viewBox="0 0 24 24"><path d="M21 2l-2 2m-2-2l2 2m2 2l-6 6m0 0a5 5 0 1 1-7-7 5 5 0 0 1 7 7z"></path></svg>
    );
    const IconBell = () => (
      <svg className="svg-icon bell-ring" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
    );
    const IconFeather = () => (
      <svg className="svg-icon" viewBox="0 0 24 24"><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L3 13v5h5l9.24-9.24z"></path><line x1="16" y1="8" x2="2" y2="22"></line></svg>
    );
    const IconGramophone = () => (
      <svg className="svg-icon" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
    );
    const IconLedger = () => (
      <svg className="svg-icon" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
    );
    const IconDownload = () => (
      <svg className="svg-icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
    );
    const IconClock = () => (
      <svg className="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
    );
    const IconUser = () => (
      <svg className="svg-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
    );
    const IconMenu = () => (
      <svg className="svg-icon" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    );

    // --- NAVIGATION BAR ---
    function Navbar({ currentPage, navigate, user, onLogout }) {
      const [menuOpen, setMenuOpen] = useState(false);

      const handleNavClick = (page) => {
        navigate(page);
        setMenuOpen(false);
      };

      return (
        <nav className="navbar">
          <div className="brand" onClick={() => handleNavClick('home')} style={{cursor: 'pointer'}}>
            <img src="/src/assets/logo.png" alt="MockMate Grand Hotel Logo" className="brand-logo-img" />
            <span>MockMate Grand Hotel</span>
          </div>

          <button className="mobile-menu-btn" onClick={() => setMenuOpen(!menuOpen)}>
            <IconMenu />
          </button>

          <div className={`nav-links ${menuOpen ? 'open' : ''}`}>
            <span className={`nav-item ${currentPage === 'home' ? 'active' : ''}`} onClick={() => handleNavClick('home')}>
              Grand Lobby
            </span>

            {user ? (
              <>
                <span className={`nav-item ${currentPage === 'dashboard' ? 'active' : ''}`} onClick={() => handleNavClick('dashboard')}>
                  Guest Ledger
                </span>
                <span className={`nav-item ${currentPage === 'setup' ? 'active' : ''}`} onClick={() => handleNavClick('setup')}>
                  Assessment Suite
                </span>
                <span className={`nav-item ${currentPage === 'history' ? 'active' : ''}`} onClick={() => handleNavClick('history')}>
                  Archives
                </span>
                <div style={{display: 'flex', alignItems: 'center', gap: '8px', marginLeft: '8px', flexWrap: 'wrap'}}>
                  <span className="badge badge-gold">
                    <IconUser /> {user.name}
                  </span>
                  <button className="btn btn-secondary btn-sm" onClick={onLogout}>Check Out</button>
                </div>
              </>
            ) : (
              <>
                <span className={`nav-item ${currentPage === 'login' ? 'active' : ''}`} onClick={() => handleNavClick('login')}>
                  Sign In
                </span>
                <button className="btn btn-primary btn-sm" onClick={() => handleNavClick('register')}>
                  Register Guest
                </button>
              </>
            )}
          </div>
        </nav>
      );
    }

    // --- HOME PAGE ---
    function HomePage({ navigate, user }) {
      return (
        <div className="animate-fade-in">
          {/* Main Hero Header */}
          <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(290px, 1fr))', gap: '28px', alignItems: 'center', padding: '16px 0 28px'}}>
            <div>
              <div style={{display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '14px'}}>
                <span className="wax-seal" style={{width: '36px', height: '36px', fontSize: '0.75rem'}}>EST 1926</span>
                <span className="badge badge-gold">
                  <IconKey /> Grand Assessment Concierge
                </span>
              </div>

              <h1 style={{fontSize: '2.5rem', fontWeight: '800', fontFamily: 'var(--font-serif)', lineHeight: '1.2', marginBottom: '16px', color: 'var(--text-light)'}}>
                Welcome to the MockMate Grand Hotel
              </h1>

              <p style={{fontSize: '1.05rem', color: 'var(--text-secondary)', marginBottom: '24px', lineHeight: '1.7', fontFamily: 'var(--font-serif)'}}>
                Step into our prestigious vintage assessment suite. Practice domain-tailored technical evaluations across Software Architecture, AI Systems, Data Engineering, and Technical Management with real-time AI evaluation and official parchment report certificates.
              </p>

              <div className="btn-stack-mobile" style={{display: 'flex', gap: '12px', flexWrap: 'wrap'}}>
                <button className="btn btn-primary" style={{padding: '12px 26px'}} onClick={() => navigate(user ? 'setup' : 'login')}>
                  <IconBell /> Enter Assessment Suite
                </button>
                <button className="btn btn-secondary" style={{padding: '12px 26px'}} onClick={() => navigate(user ? 'dashboard' : 'register')}>
                  <IconLedger /> View Guest Ledger
                </button>
              </div>
            </div>

            {/* Generated Vintage Hotel Illustration */}
            <div>
              <img src="/src/assets/hero.jpg" alt="MockMate Grand Hotel Lobby" className="img-card" style={{maxHeight: '300px'}} />
            </div>
          </div>

          {/* System Overview Grid */}
          <div style={{marginTop: '24px'}}>
            <h3 style={{fontSize: '1.25rem', fontFamily: 'var(--font-hotel)', fontWeight: '700', marginBottom: '18px', color: 'var(--gold-light)', textTransform: 'uppercase', letterSpacing: '1px'}}>
              Grand Concierge Capabilities
            </h3>

            <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(240px, 1fr))', gap: '16px'}}>
              <div className="card card-hover">
                <div style={{color: 'var(--gold-light)', marginBottom: '12px'}}><IconKey /></div>
                <h4 style={{fontSize: '1.05rem', fontFamily: 'var(--font-serif)', fontWeight: '700', marginBottom: '6px', color: 'var(--text-light)'}}>Dynamic AI Questioning</h4>
                <p style={{color: 'var(--text-secondary)', fontSize: '0.85rem'}}>
                  Questions are generated dynamically based on selected difficulty, domain, and candidate skills extracted from guest PDF resumes.
                </p>
              </div>

              <div className="card card-hover">
                <div style={{color: 'var(--gold-light)', marginBottom: '12px'}}><IconGramophone /></div>
                <h4 style={{fontSize: '1.05rem', fontFamily: 'var(--font-serif)', fontWeight: '700', marginBottom: '6px', color: 'var(--text-light)'}}>Gramophone Voice Mode</h4>
                <p style={{color: 'var(--text-secondary)', fontSize: '0.85rem'}}>
                  Supports typed telegram answers and spoken verbal responses with real-time speech transcription preview.
                </p>
              </div>

              <div className="card card-hover">
                <div style={{color: 'var(--gold-light)', marginBottom: '12px'}}><IconLedger /></div>
                <h4 style={{fontSize: '1.05rem', fontFamily: 'var(--font-serif)', fontWeight: '700', marginBottom: '6px', color: 'var(--text-light)'}}>Vector Evaluation Ledger</h4>
                <p style={{color: 'var(--text-secondary)', fontSize: '0.85rem'}}>
                  Evaluates responses using Sentence Transformer vector embeddings and multi-factor scoring (Technical, Accuracy, Relevance, Grammar, Communication).
                </p>
              </div>

              <div className="card card-hover">
                <div style={{color: 'var(--gold-light)', marginBottom: '12px'}}><IconFeather /></div>
                <h4 style={{fontSize: '1.05rem', fontFamily: 'var(--font-serif)', fontWeight: '700', marginBottom: '6px', color: 'var(--text-light)'}}>PDF Resume Parser</h4>
                <p style={{color: 'var(--text-secondary)', fontSize: '0.85rem'}}>
                  Parses guest PDF resumes to extract candidate technical skill profiles (Python, React, SQL, AWS, DSA) for targeted questioning.
                </p>
              </div>
            </div>
          </div>

          {/* Workflow Sequence */}
          <div className="card" style={{marginTop: '32px', padding: '28px'}}>
            <h3 style={{fontSize: '1.15rem', fontFamily: 'var(--font-hotel)', fontWeight: '700', marginBottom: '22px', textAlign: 'center', color: 'var(--gold-light)', letterSpacing: '1px'}}>
              The Grand Assessment Sequence
            </h3>
            
            <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: '18px'}}>
              <div style={{textAlign: 'center'}}>
                <div className="badge badge-slate" style={{marginBottom: '10px', fontSize: '0.75rem'}}>Suite 01</div>
                <h5 style={{fontSize: '0.95rem', fontFamily: 'var(--font-serif)', fontWeight: '700', marginBottom: '4px'}}>Configure Setup</h5>
                <p style={{fontSize: '0.8rem', color: 'var(--text-muted)'}}>Select domain, difficulty level, and response format.</p>
              </div>

              <div style={{textAlign: 'center'}}>
                <div className="badge badge-slate" style={{marginBottom: '10px', fontSize: '0.75rem'}}>Suite 02</div>
                <h5 style={{fontSize: '0.95rem', fontFamily: 'var(--font-serif)', fontWeight: '700', marginBottom: '4px'}}>Answer Questions</h5>
                <p style={{fontSize: '0.8rem', color: 'var(--text-muted)'}}>Submit telegram or voice answers under timed conditions.</p>
              </div>

              <div style={{textAlign: 'center'}}>
                <div className="badge badge-slate" style={{marginBottom: '10px', fontSize: '0.75rem'}}>Suite 03</div>
                <h5 style={{fontSize: '0.95rem', fontFamily: 'var(--font-serif)', fontWeight: '700', marginBottom: '4px'}}>AI Evaluation</h5>
                <p style={{fontSize: '0.8rem', color: 'var(--text-muted)'}}>Semantic transformer analysis rates technical depth & accuracy.</p>
              </div>

              <div style={{textAlign: 'center'}}>
                <div className="badge badge-slate" style={{marginBottom: '10px', fontSize: '0.75rem'}}>Suite 04</div>
                <h5 style={{fontSize: '0.95rem', fontFamily: 'var(--font-serif)', fontWeight: '700', marginBottom: '4px'}}>Parchment Report</h5>
                <p style={{fontSize: '0.8rem', color: 'var(--text-muted)'}}>Review competency breakdown and export official PDF certificate.</p>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- LOGIN PAGE ---
    function LoginPage({ navigate, onLoginSuccess }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError('');
        try {
          await window.api.login(email, password);
          onLoginSuccess();
          navigate('dashboard');
        } catch (err) {
          setError(err.message || 'Invalid email or password');
        } finally {
          setLoading(false);
        }
      };

      const handleDemoLogin = async () => {
        setLoading(true);
        setError('');
        try {
          try {
            await window.api.login('student@example.com', 'password123');
          } catch (e) {
            await window.api.register('Candidate Demo', 'student@example.com', 'password123');
          }
          onLoginSuccess();
          navigate('dashboard');
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="animate-fade-in" style={{maxWidth: '400px', margin: '30px auto'}}>
          <div className="card">
            <div style={{textAlign: 'center', marginBottom: '14px'}}>
              <img src="/src/assets/logo.png" alt="MockMate Hotel Emblem" style={{width: '56px', height: '56px', borderRadius: '8px', border: '1px solid var(--gold-primary)'}} />
            </div>
            <h2 style={{fontSize: '1.4rem', fontFamily: 'var(--font-serif)', fontWeight: '800', marginBottom: '4px', textAlign: 'center', color: 'var(--gold-light)'}}>Guest Sign In</h2>
            <p style={{color: 'var(--text-secondary)', fontSize: '0.85rem', textAlign: 'center', marginBottom: '18px'}}>
              Sign in to access your MockMate Grand Hotel evaluation records
            </p>

            {error && (
              <div style={{padding: '10px', background: 'var(--burgundy-bg)', border: '1px solid #8f2d2d', color: '#fca5a5', borderRadius: '4px', fontSize: '0.85rem', marginBottom: '14px'}}>
                {error}
              </div>
            )}

            <form onSubmit={handleSubmit}>
              <div className="form-group">
                <label>Email Address</label>
                <input type="email" className="form-input" placeholder="guest@example.com" value={email} onChange={e => setEmail(e.target.value)} required />
              </div>

              <div className="form-group">
                <label>Password</label>
                <input type="password" className="form-input" placeholder="••••••••" value={password} onChange={e => setPassword(e.target.value)} required />
              </div>

              <button type="submit" className="btn btn-primary" style={{width: '100%', marginTop: '6px'}} disabled={loading}>
                {loading ? 'Authenticating Guest...' : 'Sign In'}
              </button>

              <button type="button" className="btn btn-secondary" style={{width: '100%', marginTop: '10px'}} onClick={handleDemoLogin} disabled={loading}>
                Quick Demo Guest Access
              </button>
            </form>

            <div style={{textAlign: 'center', marginTop: '18px', fontSize: '0.85rem', color: 'var(--text-secondary)'}}>
              New guest? <span style={{color: 'var(--gold-light)', cursor: 'pointer', fontWeight: '700'}} onClick={() => navigate('register')}>Register Account</span>
            </div>
          </div>
        </div>
      );
    }

    // --- REGISTER PAGE ---
    function RegisterPage({ navigate, onLoginSuccess }) {
      const [name, setName] = useState('');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [confirmPassword, setConfirmPassword] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (password !== confirmPassword) {
          setError("Passwords do not match");
          return;
        }
        setLoading(true);
        setError('');
        try {
          await window.api.register(name, email, password);
          onLoginSuccess();
          navigate('dashboard');
        } catch (err) {
          setError(err.message || 'Registration failed');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="animate-fade-in" style={{maxWidth: '420px', margin: '30px auto'}}>
          <div className="card">
            <div style={{textAlign: 'center', marginBottom: '14px'}}>
              <img src="/src/assets/logo.png" alt="MockMate Hotel Emblem" style={{width: '56px', height: '56px', borderRadius: '8px', border: '1px solid var(--gold-primary)'}} />
            </div>
            <h2 style={{fontSize: '1.4rem', fontFamily: 'var(--font-serif)', fontWeight: '800', marginBottom: '4px', textAlign: 'center', color: 'var(--gold-light)'}}>Register New Guest</h2>
            <p style={{color: 'var(--text-secondary)', fontSize: '0.85rem', textAlign: 'center', marginBottom: '18px'}}>
              Register a new guest account at MockMate Grand Hotel
            </p>

            {error && (
              <div style={{padding: '10px', background: 'var(--burgundy-bg)', border: '1px solid #8f2d2d', color: '#fca5a5', borderRadius: '4px', fontSize: '0.85rem', marginBottom: '14px'}}>
                {error}
              </div>
            )}

            <form onSubmit={handleSubmit}>
              <div className="form-group">
                <label>Full Guest Name</label>
                <input type="text" className="form-input" placeholder="John Doe" value={name} onChange={e => setName(e.target.value)} required />
              </div>

              <div className="form-group">
                <label>Email Address</label>
                <input type="email" className="form-input" placeholder="guest@example.com" value={email} onChange={e => setEmail(e.target.value)} required />
              </div>

              <div className="form-group">
                <label>Password</label>
                <input type="password" className="form-input" placeholder="••••••••" value={password} onChange={e => setPassword(e.target.value)} required />
              </div>

              <div className="form-group">
                <label>Confirm Password</label>
                <input type="password" className="form-input" placeholder="••••••••" value={confirmPassword} onChange={e => setConfirmPassword(e.target.value)} required />
              </div>

              <button type="submit" className="btn btn-primary" style={{width: '100%', marginTop: '6px'}} disabled={loading}>
                {loading ? 'Registering Guest...' : 'Register Account'}
              </button>
            </form>

            <div style={{textAlign: 'center', marginTop: '18px', fontSize: '0.85rem', color: 'var(--text-secondary)'}}>
              Already registered? <span style={{color: 'var(--gold-light)', cursor: 'pointer', fontWeight: '700'}} onClick={() => navigate('login')}>Sign In</span>
            </div>
          </div>
        </div>
      );
    }

    // --- DASHBOARD PAGE ---
    function DashboardPage({ navigate, onSelectInterview }) {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [uploading, setUploading] = useState(false);
      const [uploadMsg, setUploadMsg] = useState('');
      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      const loadDashboard = async () => {
        setLoading(true);
        try {
          const res = await window.api.getDashboardData();
          setData(res);
        } catch (err) {
          console.error(err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        loadDashboard();
      }, []);

      useEffect(() => {
        if (data && data.score_trends && data.score_trends.length > 0 && chartRef.current) {
          if (chartInstance.current) {
            chartInstance.current.destroy();
          }
          const ctx = chartRef.current.getContext('2d');
          chartInstance.current = new Chart(ctx, {
            type: 'line',
            data: {
              labels: data.score_trends.map(t => t.date),
              datasets: [{
                label: 'Assessment Overall Score (0-10)',
                data: data.score_trends.map(t => t.score),
                borderColor: '#c59b27',
                backgroundColor: 'rgba(197, 155, 39, 0.12)',
                borderWidth: 2,
                fill: true,
                tension: 0.2,
                pointBackgroundColor: '#e5c158',
                pointRadius: 5
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              scales: {
                y: { min: 0, max: 10, grid: { color: 'rgba(197, 155, 39, 0.1)' }, ticks: { color: '#c4b5a2', font: { family: 'Playfair Display' } } },
                x: { grid: { color: 'rgba(197, 155, 39, 0.1)' }, ticks: { color: '#c4b5a2', font: { family: 'Playfair Display' } } }
              },
              plugins: {
                legend: { labels: { color: '#f5ebe0', font: { family: 'Cinzel', size: 12 } } }
              }
            }
          });
        }
      }, [data]);

      const handleFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setUploading(true);
        setUploadMsg('');
        try {
          const res = await window.api.uploadResume(file);
          setUploadMsg(`Parsed resume successfully. Extracted ${res.extracted_skills.length} technical skills.`);
          loadDashboard();
        } catch (err) {
          setUploadMsg(`Upload failed: ${err.message}`);
        } finally {
          setUploading(false);
        }
      };

      if (loading) {
        return (
          <div style={{display: 'flex', justifyContent: 'center', alignItems: 'center', height: '260px', flexDirection: 'column', gap: '14px'}}>
            <div className="spinner-std"></div>
            <div style={{color: 'var(--gold-light)', fontSize: '0.95rem', fontFamily: 'var(--font-hotel)'}}>Retrieving Guest Ledger...</div>
          </div>
        );
      }

      return (
        <div className="animate-fade-in">
          {/* Header */}
          <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '22px', flexWrap: 'wrap', gap: '14px'}}>
            <div>
              <h1 style={{fontSize: '1.85rem', fontFamily: 'var(--font-serif)', fontWeight: '800'}}>Grand Guest Ledger</h1>
              <p style={{color: 'var(--text-secondary)', fontSize: '0.875rem'}}>
                Candidate interview readiness and historical evaluation insights
              </p>
            </div>
            <button className="btn btn-primary" onClick={() => navigate('setup')}>
              <IconBell /> New Assessment Suite
            </button>
          </div>

          {/* Key Indicators Grid */}
          <div className="kpi-grid">
            <div className="kpi-card">
              <div className="kpi-title">Total Assessments</div>
              <div className="kpi-value">{data.total_interviews}</div>
            </div>

            <div className="kpi-card">
              <div className="kpi-title">Average Ledger Score</div>
              <div className="kpi-value">
                {data.average_score.toFixed(1)} <span style={{fontSize: '0.95rem', color: 'var(--text-muted)', fontWeight: '500'}}>/ 10</span>
              </div>
            </div>

            <div className="kpi-card">
              <div className="kpi-title">Best Score</div>
              <div className="kpi-value" style={{color: 'var(--gold-light)'}}>
                {data.best_score.toFixed(1)} <span style={{fontSize: '0.95rem', color: 'var(--text-muted)', fontWeight: '500'}}>/ 10</span>
              </div>
            </div>

            <div className="kpi-card">
              <div className="kpi-title">Extracted Skills</div>
              <div className="kpi-value">{data.extracted_skills.length}</div>
            </div>
          </div>

          {/* Resume Banner with Topic Illustration */}
          <div className="card" style={{marginBottom: '24px'}}>

    // --- INTERVIEW PAGE ---
    function InterviewPage({ interviewData, navigate, onCompleteInterview }) {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [answerText, setAnswerText] = useState('');
      const [isRecording, setIsRecording] = useState(false);
      const [transcriptionMsg, setTranscriptionMsg] = useState('');
      const [timerSeconds, setTimerSeconds] = useState(180);
      const [submitting, setSubmitting] = useState(false);
      const [showHint, setShowHint] = useState(false);

      const questions = interviewData ? interviewData.questions : [];
      const currentQuestion = questions[currentIndex] || {};

      useEffect(() => {
        setTimerSeconds(180);
        setShowHint(false);
        const interval = setInterval(() => {
          setTimerSeconds(prev => (prev > 0 ? prev - 1 : 0));
        }, 1000);
        return () => clearInterval(interval);
      }, [currentIndex]);

      const formatTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${m}:${s < 10 ? '0' : ''}${s}`;
      };

      const handleMicToggle = async () => {
        if (!isRecording) {
          setIsRecording(true);
          setTranscriptionMsg('Gramophone recording active... Speak clearly into your microphone.');
          window.voiceService.startRecording(
            (transcript) => {
              setAnswerText(prev => (prev ? prev + ' ' + transcript : transcript));
            },
            (err) => {
              setTranscriptionMsg(err);
              setIsRecording(false);
            }
          );
        } else {
          setIsRecording(false);
          setTranscriptionMsg('Transcribing gramophone recording...');
          const audioBlob = await window.voiceService.stopRecording();
          if (audioBlob) {
            try {
              const res = await window.api.transcribeSpeech(audioBlob);
              if (res.text && res.text.trim()) {
                setAnswerText(prev => (prev ? prev + '\n' + res.text : res.text));
                setTranscriptionMsg('Transcription completed.');
              }
            } catch (e) {
              setTranscriptionMsg('Transcribed response.');
            }
          }
        }
      };

      const handleNextSubmit = async () => {
        if (!answerText.trim()) {
          alert('Please provide an answer before submitting.');
          return;
        }

        setSubmitting(true);
        try {
          await window.api.submitAnswer(
            interviewData.interview_id,
            currentQuestion.id,
            answerText
          );

          setAnswerText('');
          setTranscriptionMsg('');

          if (currentIndex + 1 < questions.length) {
            setCurrentIndex(prev => prev + 1);
          } else {
            await window.api.completeInterview(interviewData.interview_id);
            onCompleteInterview(interviewData.interview_id);
            navigate('result');
          }
        } catch (err) {
          alert(`Submission error: ${err.message}`);
        } finally {
          setSubmitting(false);
        }
      };

      if (!interviewData || questions.length === 0) {
        return (
          <div style={{textAlign: 'center', padding: '60px'}}>
            <h3>No active assessment suite session found.</h3>
            <button className="btn btn-primary" style={{marginTop: '14px'}} onClick={() => navigate('setup')}>Setup Session</button>
          </div>
        );
      }

      const progressPct = ((currentIndex + 1) / questions.length) * 100;

      return (
        <div className="animate-fade-in" style={{maxWidth: '820px', margin: '0 auto'}}>
          {/* Vintage Header Track */}
          <div className="card" style={{marginBottom: '16px', padding: '16px 20px'}}>
            <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px', flexWrap: 'wrap', gap: '8px'}}>
              <div>
                <span className="badge badge-gold">{interviewData.domain}</span>
                <span className="badge badge-slate" style={{marginLeft: '6px'}}>{interviewData.difficulty}</span>
                <span className="badge badge-slate" style={{marginLeft: '6px'}}>{interviewData.mode}</span>
              </div>

              <div style={{display: 'flex', alignItems: 'center', gap: '14px', fontSize: '0.85rem', fontFamily: 'var(--font-hotel)'}}>
                <div style={{fontWeight: '700', color: timerSeconds < 30 ? '#fca5a5' : 'var(--gold-light)'}}>
                  <IconClock /> {formatTime(timerSeconds)}
                </div>
                <div style={{color: 'var(--text-secondary)'}}>
                  Telegram {currentIndex + 1} of {questions.length}
                </div>
              </div>
            </div>

            <div className="progress-track">
              <div className="progress-fill" style={{width: `${progressPct}%`}}></div>
            </div>
          </div>

          {/* Vintage Telegram Question Card */}
          <div className="card" style={{border: '2px double var(--gold-primary)'}}>
            <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '8px'}}>
              <span style={{fontSize: '0.75rem', fontFamily: 'var(--font-hotel)', color: 'var(--gold-light)', textTransform: 'uppercase', fontWeight: '700', letterSpacing: '1px'}}>
                TELEGRAM QUERY #{currentIndex + 1}
              </span>

              <button
                className="btn btn-outline btn-sm"
                style={{padding: '4px 10px', fontSize: '0.75rem'}}
                onClick={() => setShowHint(!showHint)}
              >
                {showHint ? 'Hide Response Structure' : 'Response Structure Guide'}
              </button>
            </div>

            <h3 style={{fontSize: '1.25rem', fontFamily: 'var(--font-typewriter)', fontWeight: '700', lineHeight: '1.5', marginBottom: '16px', color: 'var(--parchment-dark)', background: '#130a07', padding: '14px 16px', borderRadius: '4px', border: '1px dashed var(--gold-dark)'}}>
              "{currentQuestion.question}"
            </h3>

            {/* Answer Structure Guide */}
            {showHint && (
              <div style={{padding: '12px 14px', background: 'rgba(197,155,39,0.08)', border: '1px solid var(--gold-dark)', borderRadius: '6px', marginBottom: '16px', fontSize: '0.85rem', color: 'var(--text-secondary)'}}>
                <b style={{color: 'var(--gold-light)', fontFamily: 'var(--font-hotel)'}}>💡 High-Scoring Technical Answer Structure:</b>
                <ul style={{paddingLeft: '18px', marginTop: '6px'}}>
                  <li>1. State clear technical definition directly.</li>
                  <li>2. Explain key mechanics & architectural trade-offs.</li>
                  <li>3. Provide a practical real-world scenario or code example.</li>
                </ul>
              </div>
            )}

            <div className="form-group">
              <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '6px'}}>
                <label>Candidate Telegram Response</label>
                <span style={{fontSize: '0.75rem', color: 'var(--text-muted)', fontFamily: 'var(--font-typewriter)'}}>
                  {answerText.split(/\s+/).filter(Boolean).length} words
                </span>
              </div>

              <textarea
                className="form-textarea"
                rows="7"
                placeholder="Type your technical response here (Vintage typewriter format)..."
                value={answerText}
                onChange={e => setAnswerText(e.target.value)}
              />
            </div>

            {interviewData.mode === 'Voice' && (
              <div style={{display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '10px', margin: '16px 0'}}>
                <button className={`mic-btn-vintage ${isRecording ? 'recording' : ''}`} onClick={handleMicToggle}>
                  <IconGramophone />
                </button>
                
                {isRecording && (
                  <div className="gramophone-visualizer">
                    <div className="gramophone-bar"></div>
                    <div className="gramophone-bar"></div>
                    <div className="gramophone-bar"></div>
                    <div className="gramophone-bar"></div>
                    <div className="gramophone-bar"></div>
                  </div>
                )}

                <div style={{fontSize: '0.825rem', color: isRecording ? '#fca5a5' : 'var(--text-muted)', fontFamily: 'var(--font-serif)'}}>
                  {isRecording ? 'Gramophone recording active... Click button to finalize speech' : 'Click gramophone icon to record verbal response'}
                </div>
                {transcriptionMsg && (
                  <div style={{fontSize: '0.825rem', color: 'var(--gold-light)'}}>
                    {transcriptionMsg}
                  </div>
                )}
              </div>
            )}

            <div style={{display: 'flex', justifyContent: 'flex-end', marginTop: '16px'}}>
              <button className="btn btn-emerald" onClick={handleNextSubmit} disabled={submitting}>
                {submitting ? 'Evaluating Telegram...' : (currentIndex + 1 < questions.length ? 'Submit Answer' : 'Finalize Assessment')}
              </button>
            </div>
          </div>
        </div>
      );
    }

                </div>
                <div className="progress-track"><div className="progress-fill" style={{width: `${(result.overall_accuracy/10)*100}%`}}></div></div>
              </div>

              <div style={{marginBottom: '10px'}}>
                <div style={{display: 'flex', justifyContent: 'space-between', fontSize: '0.8rem', marginBottom: '3px'}}>
                  <span>Prompt Relevance</span>
                  <span>{result.overall_relevance.toFixed(1)} / 10</span>
                </div>
                <div className="progress-track"><div className="progress-fill" style={{width: `${(result.overall_relevance/10)*100}%`}}></div></div>
              </div>

              <div style={{marginBottom: '10px'}}>
                <div style={{display: 'flex', justifyContent: 'space-between', fontSize: '0.8rem', marginBottom: '3px'}}>
                  <span>Communication Clarity</span>
                  <span>{result.overall_communication.toFixed(1)} / 10</span>
                </div>
                <div className="progress-track"><div className="progress-fill" style={{width: `${(result.overall_communication/10)*100}%`}}></div></div>
              </div>

              <div>
                <div style={{display: 'flex', justifyContent: 'space-between', fontSize: '0.8rem', marginBottom: '3px'}}>
                  <span>Language Grammar</span>
                  <span>{result.overall_grammar.toFixed(1)} / 10</span>
                </div>
                <div className="progress-track"><div className="progress-fill" style={{width: `${(result.overall_grammar/10)*100}%`}}></div></div>
              </div>
            </div>
          </div>

          {/* Strengths & Weaknesses Grid */}
          <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(240px, 1fr))', gap: '16px', marginBottom: '22px'}}>
            <div className="card" style={{borderLeft: '4px solid #1b4d3e'}}>
              <h4 style={{fontSize: '0.9rem', fontFamily: 'var(--font-hotel)', color: '#a7f3d0', marginBottom: '8px'}}>Candidate Strengths</h4>
              <ul style={{paddingLeft: '18px', fontSize: '0.85rem', color: 'var(--text-secondary)'}}>
                {result.strengths.map((s, i) => <li key={i} style={{marginBottom: '4px'}}>{s}</li>)}
              </ul>
            </div>

            <div className="card" style={{borderLeft: '4px solid #6b1d1d'}}>
              <h4 style={{fontSize: '0.9rem', fontFamily: 'var(--font-hotel)', color: '#fca5a5', marginBottom: '8px'}}>Areas for Growth</h4>
              <ul style={{paddingLeft: '18px', fontSize: '0.85rem', color: 'var(--text-secondary)'}}>
                {result.weaknesses.map((w, i) => <li key={i} style={{marginBottom: '4px'}}>{w}</li>)}
              </ul>
            </div>
          </div>

          {/* AI Recommendations */}
          <div className="card" style={{marginBottom: '22px', borderLeft: '4px solid var(--gold-primary)'}}>
            <h4 style={{fontSize: '0.9rem', fontFamily: 'var(--font-hotel)', color: 'var(--gold-light)', marginBottom: '8px'}}>MockMate Concierge Recommendations</h4>
            <ul style={{paddingLeft: '18px', fontSize: '0.85rem', color: 'var(--text-secondary)'}}>
              {result.suggestions.map((sug, i) => <li key={i} style={{marginBottom: '5px'}}>{sug}</li>)}
            </ul>
          </div>

          {/* Question Breakdown */}
          <div className="card">
            <h4 style={{fontSize: '1.05rem', fontFamily: 'var(--font-serif)', fontWeight: '700', marginBottom: '14px', color: 'var(--gold-light)'}}>Telegram Question Breakdown</h4>
            {result.responses.map((resp, idx) => {
              const qObj = result.questions.find(q => q.id === resp.question_id) || {};
              return (
                <div key={idx} style={{padding: '14px 16px', background: '#130a07', borderRadius: '6px', marginBottom: '12px', border: '1px solid var(--gold-dark)'}}>
                  <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '6px'}}>
                    <h5 style={{fontSize: '0.9rem', fontFamily: 'var(--font-serif)', fontWeight: '700'}}>Telegram #{idx+1}: {qObj.question}</h5>
                    <span className="badge badge-gold">Score: {resp.overall} / 10</span>
                  </div>

                  <div style={{fontSize: '0.85rem', color: 'var(--text-secondary)', fontFamily: 'var(--font-typewriter)', marginBottom: '6px'}}>
                    <b>Candidate Response:</b> "{resp.answer}"
                  </div>

                  <div style={{fontSize: '0.85rem', color: 'var(--parchment-dark)', marginBottom: '6px'}}>
                    <b>Reference Answer:</b> "{qObj.expected_answer}"
                  </div>

                  <div style={{fontSize: '0.85rem', color: 'var(--gold-light)'}}>
                    <b>AI Feedback:</b> {resp.feedback} (Semantic Similarity: {Math.round((resp.semantic_similarity || 0) * 100)}%)
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // --- HISTORY PAGE ---
    function HistoryPage({ navigate, onSelectInterview }) {
      const [history, setHistory] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        window.api.getInterviewHistory()
          .then(res => setHistory(res))
          .catch(err => console.error(err))
          .finally(() => setLoading(false));
      }, []);

      if (loading) {
        return (
          <div style={{display: 'flex', justifyContent: 'center', alignItems: 'center', height: '260px', flexDirection: 'column', gap: '14px'}}>
            <div className="spinner-std"></div>
            <div style={{color: 'var(--gold-light)', fontSize: '0.95rem', fontFamily: 'var(--font-hotel)'}}>Retrieving Hotel Archives...</div>
          </div>
        );
      }

      return (
        <div className="animate-fade-in" style={{maxWidth: '980px', margin: '0 auto'}}>
          <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '22px', flexWrap: 'wrap', gap: '12px'}}>
            <div>
              <h1 style={{fontSize: '1.85rem', fontFamily: 'var(--font-serif)', fontWeight: '800'}}>Grand Assessment Archives</h1>
              <p style={{color: 'var(--text-secondary)', fontSize: '0.875rem'}}>Historical records of candidate evaluation sessions</p>
            </div>
            <button className="btn btn-primary" onClick={() => navigate('setup')}><IconBell /> New Assessment Suite</button>
          </div>

          <div className="card">
            {history.length > 0 ? (
              <div className="data-table-container">
                <table className="data-table">
                  <thead>
                    <tr>
                      <th>ID</th>
                      <th>Date</th>
                      <th>Domain</th>
                      <th>Difficulty</th>
                      <th>Mode</th>
                      <th>Questions</th>
                      <th>Score</th>
                      <th>Action</th>
                    </tr>
                  </thead>
                  <tbody>
                    {history.map((item) => (
                      <tr key={item.id}>
                        <td>#{item.id}</td>
                        <td>{new Date(item.created_at).toLocaleDateString()}</td>
                        <td><span className="badge badge-slate">{item.domain}</span></td>
                        <td><span className="badge badge-slate">{item.difficulty}</span></td>
                        <td>{item.mode}</td>
                        <td>{item.questions_count}</td>
                        <td style={{fontWeight: '700', color: item.total_score >= 7 ? 'var(--gold-light)' : '#fcd34d'}}>
                          {item.total_score.toFixed(1)} / 10
                        </td>
                        <td>
                          <button className="btn btn-secondary btn-sm" onClick={() => { onSelectInterview(item.id); navigate('result'); }}>
                            View Report
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            ) : (
              <div style={{textAlign: 'center', padding: '28px', color: 'var(--text-muted)', fontSize: '0.875rem'}}>
                No past interview records found in archives.
              </div>
            )}
          </div>
        </div>
      );
    }

    // --- MAIN APP COMPONENT ---
    function App() {
      const [currentPage, setCurrentPage] = useState('home');
      const [user, setUser] = useState(window.api.getUser());
      const [activeInterviewData, setActiveInterviewData] = useState(null);
      const [selectedResultId, setSelectedResultId] = useState(null);

      useEffect(() => {
        const handleAuthChanged = () => {
          setUser(window.api.getUser());
        };
        window.addEventListener('auth-changed', handleAuthChanged);
        return () => window.removeEventListener('auth-changed', handleAuthChanged);
      }, []);

      const handleLogout = () => {
        window.api.clearAuth();
        setUser(null);
        setCurrentPage('home');
      };

      const navigate = (page) => {
        setCurrentPage(page);
        window.scrollTo(0, 0);
      };

      return (
        <div>
          <Navbar currentPage={currentPage} navigate={navigate} user={user} onLogout={handleLogout} />
          
          <main className="app-container">
            {currentPage === 'home' && <HomePage navigate={navigate} user={user} />}
            {currentPage === 'login' && <LoginPage navigate={navigate} onLoginSuccess={() => setUser(window.api.getUser())} />}
            {currentPage === 'register' && <RegisterPage navigate={navigate} onLoginSuccess={() => setUser(window.api.getUser())} />}
            {currentPage === 'dashboard' && <DashboardPage navigate={navigate} onSelectInterview={(id) => setSelectedResultId(id)} />}
            {currentPage === 'setup' && <SetupPage navigate={navigate} onStartInterview={(data) => setActiveInterviewData(data)} />}
            {currentPage === 'interview' && <InterviewPage interviewData={activeInterviewData} navigate={navigate} onCompleteInterview={(id) => setSelectedResultId(id)} />}
            {currentPage === 'result' && <ResultPage interviewId={selectedResultId} navigate={navigate} />}
            {currentPage === 'history' && <HistoryPage navigate={navigate} onSelectInterview={(id) => setSelectedResultId(id)} />}
          </main>
        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
