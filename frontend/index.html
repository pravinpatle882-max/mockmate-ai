<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MockMate Office - Candidate Evaluation Suite</title>
  
  <!-- Website Favicon Logo -->
  <link rel="icon" type="image/png" href="/src/assets/logo.png">
  
  <!-- Custom Corporate Office CSS -->
  <link rel="stylesheet" href="/src/css/style.css">
  
  <!-- Chart.js for analytics graphs -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- React 18 & ReactDOM 18 CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone compiler for in-browser JSX parsing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- API and Voice Services -->
  <script src="/src/services/api.js"></script>
  <script src="/src/services/voice.js"></script>

  <!-- Main React SPA Application script -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- CORPORATE OFFICE SVG ICONS ---
    const IconOffice = () => (
      <svg className="svg-icon" viewBox="0 0 24 24"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"></path><path d="M6 12H4a2 2 0 0 0-2 2v8h4"></path><path d="M18 9h2a2 2 0 0 1 2 2v11h-4"></path><path d="M10 6h4"></path><path d="M10 10h4"></path><path d="M10 14h4"></path><path d="M10 18h4"></path></svg>
    );
    const IconBriefcase = () => (
      <svg className="svg-icon" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
    );
    const IconUsers = () => (
      <svg className="svg-icon" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
    );
    const IconMic = () => (
      <svg className="svg-icon" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
    );
    const IconChart = () => (
      <svg className="svg-icon" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
    );
    const IconFileText = () => (
      <svg className="svg-icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
    );
    const IconDownload = () => (
      <svg className="svg-icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
    );
    const IconClock = () => (
      <svg className="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
    );
    const IconUser = () => (
      <svg className="svg-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
    );
    const IconHelp = () => (
      <svg className="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
    );
    const IconMenu = () => (
      <svg className="svg-icon" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    );
    const IconZap = () => (
      <svg className="svg-icon" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
    );

    // --- NAVIGATION BAR ---
    function Navbar({ currentPage, navigate, user, onLogout }) {
      const [menuOpen, setMenuOpen] = useState(false);

      const handleNavClick = (page) => {
        navigate(page);
        setMenuOpen(false);
      };

      return (
        <nav className="navbar">
          <div className="brand" onClick={() => handleNavClick('home')} style={{cursor: 'pointer'}}>
            <img src="/src/assets/logo.png" alt="MockMate Office Logo" className="brand-logo-img" />
            <span>MockMate AI</span>
          </div>

          <button className="mobile-menu-btn" onClick={() => setMenuOpen(!menuOpen)}>
            <IconMenu />
          </button>

          <div className={`nav-links ${menuOpen ? 'open' : ''}`}>
            <span className={`nav-item ${currentPage === 'home' ? 'active' : ''}`} onClick={() => handleNavClick('home')}>
              Home
            </span>

            {user ? (
              <>
                <span className={`nav-item ${currentPage === 'dashboard' ? 'active' : ''}`} onClick={() => handleNavClick('dashboard')}>
                  Dashboard
                </span>
                <span className={`nav-item ${currentPage === 'setup' ? 'active' : ''}`} onClick={() => handleNavClick('setup')}>
                  Start Test
                </span>
                <span className={`nav-item ${currentPage === 'history' ? 'active' : ''}`} onClick={() => handleNavClick('history')}>
                  History
                </span>
                <div style={{display: 'flex', alignItems: 'center', gap: '8px', marginLeft: '8px', flexWrap: 'wrap'}}>
                  <span className="badge badge-indigo">
                    <span className="pulse-dot"></span> <IconUser /> {user.name}
                  </span>
                  <button className="btn btn-secondary btn-sm" onClick={onLogout}>Sign Out</button>
                </div>
              </>
            ) : (
              <>
                <span className={`nav-item ${currentPage === 'login' ? 'active' : ''}`} onClick={() => handleNavClick('login')}>
                  Sign In
                </span>
                <button className="btn btn-primary btn-sm" onClick={() => handleNavClick('register')}>
                  Register
                </button>
              </>
            )}
          </div>
        </nav>
      );
    }

    // --- HOME PAGE (Ultra-Clean, Zero Paragraphs) ---
    function HomePage({ navigate, user }) {
      return (
        <div className="animate-fade-in">
          {/* Main Hero Header */}
          <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: '24px', alignItems: 'center', padding: '12px 0 24px'}}>
            <div>
              <div style={{display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '12px', flexWrap: 'wrap'}}>
                <span className="badge badge-indigo">
                  <IconOffice /> AI Candidate Evaluation Suite
                </span>
                <span className="badge badge-emerald">
                  <span className="pulse-dot"></span> Live Ready
                </span>
              </div>

              <h1 style={{fontSize: '2.5rem', fontWeight: '900', lineHeight: '1.15', letterSpacing: '-0.5px', marginBottom: '16px', color: 'var(--text-main)'}}>
                AI Mock Interview Platform
              </h1>

              {/* Action Chip Summary */}
              <div style={{display: 'flex', gap: '8px', flexWrap: 'wrap', marginBottom: '24px'}}>
                <span className="badge badge-slate"><IconZap /> Gemini 1.5 AI</span>
                <span className="badge badge-slate"><IconMic /> Voice & Text Input</span>
                <span className="badge badge-slate"><IconChart /> Vector Similarity</span>
                <span className="badge badge-slate"><IconDownload /> PDF Certificates</span>
              </div>

              <div className="btn-stack-mobile" style={{display: 'flex', gap: '12px', flexWrap: 'wrap'}}>
                <button className="btn btn-primary" style={{padding: '12px 28px', fontSize: '0.95rem'}} onClick={() => navigate(user ? 'setup' : 'login')}>
                  <IconBriefcase /> Start Assessment
                </button>
                <button className="btn btn-secondary" style={{padding: '12px 24px', fontSize: '0.95rem'}} onClick={() => navigate(user ? 'dashboard' : 'register')}>
                  <IconUsers /> View Dashboard
                </button>
              </div>
            </div>

            <div>
              <img src="/src/assets/hero.jpg" alt="Corporate Office Workstation" className="img-card" style={{maxHeight: '260px'}} />
            </div>
          </div>

          {/* Quick Feature Cards (Short Crisp Headers Only) */}
          <div style={{marginTop: '16px'}}>
            <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))', gap: '12px'}}>
              <div className="card card-hover" style={{padding: '16px'}}>
                <div style={{color: 'var(--primary)', marginBottom: '8px'}}><IconOffice /></div>
                <h4 style={{fontSize: '0.95rem', fontWeight: '800'}}>Dynamic AI Questions</h4>
                <div className="badge badge-indigo" style={{marginTop: '6px'}}>Software / AI / Data / SQL</div>
              </div>

              <div className="card card-hover" style={{padding: '16px'}}>
                <div style={{color: 'var(--cyan-office)', marginBottom: '8px'}}><IconMic /></div>
                <h4 style={{fontSize: '0.95rem', fontWeight: '800'}}>Voice & Speech-to-Text</h4>
                <div className="badge badge-slate" style={{marginTop: '6px'}}>Microphone Input</div>
              </div>

              <div className="card card-hover" style={{padding: '16px'}}>
                <div style={{color: 'var(--emerald-office)', marginBottom: '8px'}}><IconChart /></div>
                <h4 style={{fontSize: '0.95rem', fontWeight: '800'}}>5-Axis Evaluation</h4>
                <div className="badge badge-emerald" style={{marginTop: '6px'}}>Vector Embeddings</div>
              </div>

              <div className="card card-hover" style={{padding: '16px'}}>
                <div style={{color: 'var(--amber-office)', marginBottom: '8px'}}><IconFileText /></div>
                <h4 style={{fontSize: '0.95rem', fontWeight: '800'}}>PDF Report Certificates</h4>
                <div className="badge badge-slate" style={{marginTop: '6px'}}>Instant Export</div>
              </div>
            </div>
          </div>

          {/* 4-Step Quick Flow Banner */}
          <div className="card" style={{marginTop: '20px', padding: '20px'}}>
            <h3 style={{fontSize: '1rem', fontWeight: '800', marginBottom: '16px', textAlign: 'center', color: 'var(--text-main)'}}>
              4-Step Candidate Workflow
            </h3>
            
            <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(160px, 1fr))', gap: '12px'}}>
              <div style={{textAlign: 'center', background: '#0f172a', padding: '12px', borderRadius: '8px', border: '1px solid var(--border-subtle)'}}>
                <div className="badge badge-slate" style={{marginBottom: '6px'}}>01</div>
                <h5 style={{fontSize: '0.85rem', fontWeight: '700'}}>Setup Test</h5>
              </div>

              <div style={{textAlign: 'center', background: '#0f172a', padding: '12px', borderRadius: '8px', border: '1px solid var(--border-subtle)'}}>
                <div className="badge badge-slate" style={{marginBottom: '6px'}}>02</div>
                <h5 style={{fontSize: '0.85rem', fontWeight: '700'}}>Submit Answers</h5>
              </div>

              <div style={{textAlign: 'center', background: '#0f172a', padding: '12px', borderRadius: '8px', border: '1px solid var(--border-subtle)'}}>
                <div className="badge badge-slate" style={{marginBottom: '6px'}}>03</div>
                <h5 style={{fontSize: '0.85rem', fontWeight: '700'}}>AI Scoring</h5>
              </div>

              <div style={{textAlign: 'center', background: '#0f172a', padding: '12px', borderRadius: '8px', border: '1px solid var(--border-subtle)'}}>
                <div className="badge badge-slate" style={{marginBottom: '6px'}}>04</div>
                <h5 style={{fontSize: '0.85rem', fontWeight: '700'}}>Export PDF</h5>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- LOGIN PAGE ---
    function LoginPage({ navigate, onLoginSuccess }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError('');
        try {
          await window.api.login(email, password);
          onLoginSuccess();
          navigate('dashboard');
        } catch (err) {
          setError(err.message || 'Invalid credentials');
        } finally {
          setLoading(false);
        }
      };

      const handleDemoLogin = async () => {
        setLoading(true);
        setError('');
        try {
          try {
            await window.api.login('student@example.com', 'password123');
          } catch (e) {
            await window.api.register('Candidate Demo', 'student@example.com', 'password123');
          }
          onLoginSuccess();
          navigate('dashboard');
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="animate-fade-in" style={{maxWidth: '380px', margin: '30px auto'}}>
          <div className="card">
            <div style={{textAlign: 'center', marginBottom: '12px'}}>
              <img src="/src/assets/logo.png" alt="MockMate Office Logo" style={{width: '48px', height: '48px', borderRadius: '8px'}} />
            </div>
            <h2 style={{fontSize: '1.3rem', fontWeight: '800', textAlign: 'center', marginBottom: '16px'}}>Candidate Sign In</h2>

            {error && (
              <div style={{padding: '8px 10px', background: 'var(--rose-bg)', border: '1px solid rgba(244,63,94,0.3)', color: '#fca5a5', borderRadius: '6px', fontSize: '0.8rem', marginBottom: '12px'}}>
                {error}
              </div>
            )}

            <form onSubmit={handleSubmit}>
              <div className="form-group">
                <label>Email Address</label>
                <input type="email" className="form-input" placeholder="candidate@office.com" value={email} onChange={e => setEmail(e.target.value)} required />
              </div>

              <div className="form-group">
                <label>Password</label>
                <input type="password" className="form-input" placeholder="••••••••" value={password} onChange={e => setPassword(e.target.value)} required />
              </div>

              <button type="submit" className="btn btn-primary" style={{width: '100%', marginTop: '4px'}} disabled={loading}>
                {loading ? 'Signing in...' : 'Sign In'}
              </button>

              <button type="button" className="btn btn-secondary" style={{width: '100%', marginTop: '8px'}} onClick={handleDemoLogin} disabled={loading}>
                ⚡ 1-Click Demo Sign In
              </button>
            </form>

            <div style={{textAlign: 'center', marginTop: '14px', fontSize: '0.8rem', color: 'var(--text-secondary)'}}>
              New user? <span style={{color: '#818cf8', cursor: 'pointer', fontWeight: '600'}} onClick={() => navigate('register')}>Register</span>
            </div>
          </div>
        </div>
      );
    }

    // --- REGISTER PAGE ---
    function RegisterPage({ navigate, onLoginSuccess }) {
      const [name, setName] = useState('');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [confirmPassword, setConfirmPassword] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (password !== confirmPassword) {
          setError("Passwords do not match");
          return;
        }
        setLoading(true);
        setError('');
        try {
          await window.api.register(name, email, password);
          onLoginSuccess();
          navigate('dashboard');
        } catch (err) {
          setError(err.message || 'Registration failed');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="animate-fade-in" style={{maxWidth: '390px', margin: '30px auto'}}>
          <div className="card">
            <div style={{textAlign: 'center', marginBottom: '12px'}}>
              <img src="/src/assets/logo.png" alt="MockMate Office Logo" style={{width: '48px', height: '48px', borderRadius: '8px'}} />
            </div>
            <h2 style={{fontSize: '1.3rem', fontWeight: '800', textAlign: 'center', marginBottom: '16px'}}>Register Candidate</h2>

            {error && (
              <div style={{padding: '8px 10px', background: 'var(--rose-bg)', border: '1px solid rgba(244,63,94,0.3)', color: '#fca5a5', borderRadius: '6px', fontSize: '0.8rem', marginBottom: '12px'}}>
                {error}
              </div>
            )}

            <form onSubmit={handleSubmit}>
              <div className="form-group">
                <label>Full Name</label>
                <input type="text" className="form-input" placeholder="John Doe" value={name} onChange={e => setName(e.target.value)} required />
              </div>

              <div className="form-group">
                <label>Email Address</label>
                <input type="email" className="form-input" placeholder="candidate@office.com" value={email} onChange={e => setEmail(e.target.value)} required />
              </div>

              <div className="form-group">
                <label>Password</label>
                <input type="password" className="form-input" placeholder="••••••••" value={password} onChange={e => setPassword(e.target.value)} required />
              </div>

              <div className="form-group">
                <label>Confirm Password</label>
                <input type="password" className="form-input" placeholder="••••••••" value={confirmPassword} onChange={e => setConfirmPassword(e.target.value)} required />
              </div>

              <button type="submit" className="btn btn-primary" style={{width: '100%', marginTop: '4px'}} disabled={loading}>
                {loading ? 'Creating...' : 'Register Account'}
              </button>
            </form>

            <div style={{textAlign: 'center', marginTop: '14px', fontSize: '0.8rem', color: 'var(--text-secondary)'}}>
              Have an account? <span style={{color: '#818cf8', cursor: 'pointer', fontWeight: '600'}} onClick={() => navigate('login')}>Sign In</span>
            </div>
          </div>
        </div>
      );
    }

    // --- DASHBOARD PAGE ---
    function DashboardPage({ navigate, onSelectInterview }) {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [uploading, setUploading] = useState(false);
      const [uploadMsg, setUploadMsg] = useState('');
      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      const loadDashboard = async () => {
        setLoading(true);
        try {
          const res = await window.api.getDashboardData();
          setData(res);
        } catch (err) {
          console.error(err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        loadDashboard();
      }, []);

      useEffect(() => {
        if (data && data.score_trends && data.score_trends.length > 0 && chartRef.current) {
          if (chartInstance.current) {
            chartInstance.current.destroy();
          }
          const ctx = chartRef.current.getContext('2d');
          chartInstance.current = new Chart(ctx, {
            type: 'line',
            data: {
              labels: data.score_trends.map(t => t.date),
              datasets: [{
                label: 'Score (0-10)',
                data: data.score_trends.map(t => t.score),
                borderColor: '#6366f1',
                backgroundColor: 'rgba(99, 102, 241, 0.12)',
                borderWidth: 2,
                fill: true,
                tension: 0.2,
                pointBackgroundColor: '#4f46e5',
                pointRadius: 4
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              scales: {
                y: { min: 0, max: 10, grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#94a3b8' } },
                x: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#94a3b8' } }
              },
              plugins: {
                legend: { labels: { color: '#f8fafc', font: { family: 'Inter', size: 12 } } }
              }
            }
          });
        }
      }, [data]);

      const handleFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setUploading(true);
        setUploadMsg('');
        try {
          const res = await window.api.uploadResume(file);
          setUploadMsg(`Parsed ${res.extracted_skills.length} skills.`);
          loadDashboard();
        } catch (err) {
          setUploadMsg(`Upload failed: ${err.message}`);
        } finally {
          setUploading(false);
        }
      };

      const handleLoadSampleResume = async () => {
        setUploading(true);
        setUploadMsg('');
        try {
          const res = await window.api.loadSampleResume();
          setUploadMsg(`Loaded sample developer skills.`);
          loadDashboard();
        } catch (err) {
          setUploadMsg(`Sample load failed: ${err.message}`);
        } finally {
          setUploading(false);
        }
      };

      if (loading) {
        return (
          <div style={{display: 'flex', justifyContent: 'center', alignItems: 'center', height: '200px', flexDirection: 'column', gap: '12px'}}>
            <div className="spinner-std"></div>
            <div style={{color: 'var(--text-muted)', fontSize: '0.85rem'}}>Loading Dashboard...</div>
          </div>
        );
      }

      return (
        <div className="animate-fade-in">
          {/* Header Bar */}
          <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px', flexWrap: 'wrap', gap: '12px'}}>
            <h1 style={{fontSize: '1.5rem', fontWeight: '900'}}>Employee Dashboard</h1>
            <button className="btn btn-primary" onClick={() => navigate('setup')}>
              <IconBriefcase /> Start New Assessment
            </button>
          </div>

          {/* Key Metric Chips Grid */}
          <div className="kpi-grid" style={{marginBottom: '16px'}}>
            <div className="kpi-card">
              <div className="kpi-title">Assessments</div>
              <div className="kpi-value">{data.total_interviews}</div>
            </div>

            <div className="kpi-card">
              <div className="kpi-title">Average Score</div>
              <div className="kpi-value">
                {data.average_score.toFixed(1)} <span style={{fontSize: '0.85rem', color: 'var(--text-muted)'}}>/ 10</span>
              </div>
            </div>

            <div className="kpi-card">
              <div className="kpi-title">Best Score</div>
              <div className="kpi-value" style={{color: '#6ee7b7'}}>
                {data.best_score.toFixed(1)} <span style={{fontSize: '0.85rem', color: 'var(--text-muted)'}}>/ 10</span>
              </div>
            </div>

            <div className="kpi-card">
              <div className="kpi-title">Skills Extracted</div>
              <div className="kpi-value">{data.extracted_skills.length}</div>
            </div>
          </div>

          {/* Resume Profile Banner */}
          <div className="card" style={{marginBottom: '16px', padding: '16px'}}>
            <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '12px'}}>
              <div>
                <h4 style={{fontSize: '0.9rem', fontWeight: '800', marginBottom: '8px'}}>Candidate Skill Profile</h4>

    // --- SETUP PAGE ---

    // --- INTERVIEW PAGE ---
    function InterviewPage({ interviewData, navigate, onCompleteInterview }) {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [answerText, setAnswerText] = useState('');
      const [isRecording, setIsRecording] = useState(false);
      const [transcriptionMsg, setTranscriptionMsg] = useState('');
      const [timerSeconds, setTimerSeconds] = useState(180);
      const [submitting, setSubmitting] = useState(false);
      const [showHint, setShowHint] = useState(false);

      const questions = interviewData ? interviewData.questions : [];
      const currentQuestion = questions[currentIndex] || {};

      useEffect(() => {
        setTimerSeconds(180);
        setShowHint(false);
        const interval = setInterval(() => {
          setTimerSeconds(prev => (prev > 0 ? prev - 1 : 0));
        }, 1000);
        return () => clearInterval(interval);
      }, [currentIndex]);

      const formatTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${m}:${s < 10 ? '0' : ''}${s}`;
      };

      const handleMicToggle = async () => {
        if (!isRecording) {
          setIsRecording(true);
          setTranscriptionMsg('Recording audio...');
          window.voiceService.startRecording(
            (transcript) => {
              setAnswerText(prev => (prev ? prev + ' ' + transcript : transcript));
            },
            (err) => {
              setTranscriptionMsg(err);
              setIsRecording(false);
            }
          );
        } else {
          setIsRecording(false);
          setTranscriptionMsg('Transcribing...');
          const audioBlob = await window.voiceService.stopRecording();
          if (audioBlob) {
            try {
              const res = await window.api.transcribeSpeech(audioBlob);
              if (res.text && res.text.trim()) {
                setAnswerText(prev => (prev ? prev + '\n' + res.text : res.text));
                setTranscriptionMsg('Transcribed.');
              }
            } catch (e) {
              setTranscriptionMsg('Transcribed.');
            }
          }
        }
      };

      const handleNextSubmit = async () => {
        if (!answerText.trim()) {
          alert('Please enter an answer before submitting.');
          return;
        }

        setSubmitting(true);
        try {
          await window.api.submitAnswer(
            interviewData.interview_id,
            currentQuestion.id,
            answerText
          );

          setAnswerText('');
          setTranscriptionMsg('');

          if (currentIndex + 1 < questions.length) {
            setCurrentIndex(prev => prev + 1);
          } else {
            await window.api.completeInterview(interviewData.interview_id);
            onCompleteInterview(interviewData.interview_id);
            navigate('result');
          }
        } catch (err) {
          alert(`Submission error: ${err.message}`);
        } finally {
          setSubmitting(false);
        }
      };

      if (!interviewData || questions.length === 0) {
        return (
          <div style={{textAlign: 'center', padding: '60px'}}>
            <h3>No active session.</h3>
            <button className="btn btn-primary" style={{marginTop: '12px'}} onClick={() => navigate('setup')}>Setup Test</button>
          </div>
        );
      }

      const progressPct = ((currentIndex + 1) / questions.length) * 100;

      return (
        <div className="animate-fade-in" style={{maxWidth: '740px', margin: '0 auto'}}>
          {/* Header Progress Track */}
          <div className="card" style={{marginBottom: '12px', padding: '12px 14px'}}>
            <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '6px', flexWrap: 'wrap', gap: '6px'}}>
              <div>
                <span className="badge badge-indigo">{interviewData.domain}</span>
                <span className="badge badge-slate" style={{marginLeft: '4px'}}>{interviewData.difficulty}</span>
                <span className="badge badge-slate" style={{marginLeft: '4px'}}>{interviewData.mode}</span>
              </div>

              <div style={{display: 'flex', alignItems: 'center', gap: '10px', fontSize: '0.8rem'}}>
                <div style={{fontWeight: '700', color: timerSeconds < 30 ? '#f43f5e' : 'var(--text-main)'}}>
                  <IconClock /> {formatTime(timerSeconds)}
                </div>
                <div style={{color: 'var(--text-secondary)'}}>
                  Q{currentIndex + 1} / {questions.length}
                </div>
              </div>
            </div>

            <div className="progress-track">
              <div className="progress-fill" style={{width: `${progressPct}%`}}></div>
            </div>
          </div>

          {/* Question Card */}
          <div className="card">
            <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '6px'}}>
              <span style={{fontSize: '0.72rem', color: 'var(--text-muted)', textTransform: 'uppercase', fontWeight: '700'}}>
                QUESTION {currentIndex + 1} OF {questions.length}
              </span>

              <button
                className="btn btn-outline btn-sm"
                style={{padding: '3px 6px', fontSize: '0.72rem'}}
                onClick={() => setShowHint(!showHint)}
              >
                <IconHelp /> {showHint ? 'Hide Structure' : 'Answer Structure'}
              </button>
            </div>

            <h3 style={{fontSize: '1.15rem', fontWeight: '800', lineHeight: '1.35', marginBottom: '12px'}}>
              {currentQuestion.question}
            </h3>

            {/* Answer Structure Chips */}
            {showHint && (
              <div style={{display: 'flex', gap: '6px', flexWrap: 'wrap', marginBottom: '12px'}}>
                <span className="badge badge-indigo">1. Core Definition</span>
                <span className="badge badge-slate">2. Architecture / Trade-offs</span>
                <span className="badge badge-emerald">3. Code Example</span>
              </div>
            )}

            <div className="form-group">
              <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '4px'}}>
                <label>Answer Input</label>
                <span style={{fontSize: '0.72rem', color: 'var(--text-muted)'}}>
                  {answerText.split(/\s+/).filter(Boolean).length} words
                </span>
              </div>

              <textarea
                className="form-textarea"
                rows="6"
                placeholder="Type technical answer here..."
                value={answerText}
                onChange={e => setAnswerText(e.target.value)}
              />
            </div>

            {interviewData.mode === 'Voice' && (
              <div style={{display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '6px', margin: '10px 0'}}>
                <button className={`mic-btn-office ${isRecording ? 'recording' : ''}`} onClick={handleMicToggle}>
                  <IconMic />
                </button>
                
                {isRecording && (
                  <div className="office-wave-container">
                    <div className="office-wave-bar"></div>
                    <div className="office-wave-bar"></div>
                    <div className="office-wave-bar"></div>
                    <div className="office-wave-bar"></div>
                    <div className="office-wave-bar"></div>
                  </div>
                )}

                <div style={{fontSize: '0.75rem', color: isRecording ? '#f43f5e' : 'var(--text-muted)'}}>
                  {isRecording ? 'Recording audio...' : 'Click mic to speak answer'}
                </div>
                {transcriptionMsg && (
                  <div style={{fontSize: '0.75rem', color: '#67e8f9'}}>
                    {transcriptionMsg}
                  </div>
                )}
              </div>
            )}

            <div style={{display: 'flex', justifyContent: 'flex-end', marginTop: '12px'}}>
              <button className="btn btn-emerald" onClick={handleNextSubmit} disabled={submitting}>
                {submitting ? 'Evaluating...' : (currentIndex + 1 < questions.length ? 'Next Question' : 'Complete Test')}
              </button>
            </div>
          </div>
        </div>
      );
    }

              </div>
            </div>

            <div className="card" style={{padding: '14px', borderLeft: '3px solid #f43f5e'}}>
              <h4 style={{fontSize: '0.8rem', color: '#fca5a5', marginBottom: '6px'}}>Growth Areas</h4>
              <div style={{display: 'flex', gap: '4px', flexWrap: 'wrap'}}>
                {result.weaknesses.map((w, i) => <span key={i} className="badge badge-slate" style={{fontSize: '0.75rem'}}>{w}</span>)}
              </div>
            </div>
          </div>

          {/* Recommendations */}
          <div className="card" style={{marginBottom: '14px', padding: '14px', borderLeft: '3px solid #06b6d4'}}>
            <h4 style={{fontSize: '0.8rem', color: '#67e8f9', marginBottom: '6px'}}>Recommendations</h4>
            <div style={{display: 'flex', gap: '4px', flexWrap: 'wrap'}}>
              {result.suggestions.map((sug, i) => <span key={i} className="badge badge-slate" style={{fontSize: '0.75rem'}}>{sug}</span>)}
            </div>
          </div>

          {/* Question Breakdown */}
          <div className="card" style={{padding: '16px'}}>
            <h4 style={{fontSize: '0.85rem', fontWeight: '800', marginBottom: '10px'}}>Question Breakdown</h4>
            {result.responses.map((resp, idx) => {
              const qObj = result.questions.find(q => q.id === resp.question_id) || {};
              return (
                <div key={idx} style={{padding: '10px', background: '#0f172a', borderRadius: '6px', marginBottom: '8px', border: '1px solid var(--border-subtle)'}}>
                  <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '4px'}}>
                    <h5 style={{fontSize: '0.82rem', fontWeight: '700'}}>Q{idx+1}: {qObj.question}</h5>
                    <span className="badge badge-emerald">Score: {resp.overall} / 10</span>
                  </div>

                  <div style={{fontSize: '0.78rem', color: 'var(--text-secondary)', marginBottom: '3px'}}>
                    <b>Answer:</b> "{resp.answer}"
                  </div>

                  <div style={{fontSize: '0.78rem', color: '#a5b4fc', marginBottom: '3px'}}>
                    <b>Reference:</b> "{qObj.expected_answer}"
                  </div>

                  <div style={{fontSize: '0.78rem', color: '#67e8f9'}}>
                    <b>Feedback:</b> {resp.feedback} (Match: {Math.round((resp.semantic_similarity || 0) * 100)}%)
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // --- HISTORY PAGE ---
    function HistoryPage({ navigate, onSelectInterview }) {
      const [history, setHistory] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        window.api.getInterviewHistory()
          .then(res => setHistory(res))
          .catch(err => console.error(err))
          .finally(() => setLoading(false));
      }, []);

      if (loading) {
        return (
          <div style={{display: 'flex', justifyContent: 'center', alignItems: 'center', height: '200px', flexDirection: 'column', gap: '12px'}}>
            <div className="spinner-std"></div>
            <div style={{color: 'var(--text-muted)', fontSize: '0.85rem'}}>Loading History...</div>
          </div>
        );
      }

      return (
        <div className="animate-fade-in" style={{maxWidth: '920px', margin: '0 auto'}}>
          <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px', flexWrap: 'wrap', gap: '8px'}}>
            <h1 style={{fontSize: '1.5rem', fontWeight: '900'}}>Assessment History</h1>
            <button className="btn btn-primary" onClick={() => navigate('setup')}><IconBriefcase /> Start New Assessment</button>
          </div>

          <div className="card" style={{padding: '16px'}}>
            {history.length > 0 ? (
              <div className="data-table-container">
                <table className="data-table">
                  <thead>
                    <tr>
                      <th>ID</th>
                      <th>Date</th>
                      <th>Domain</th>
                      <th>Level</th>
                      <th>Mode</th>
                      <th>Qs</th>
                      <th>Score</th>
                      <th>Action</th>
                    </tr>
                  </thead>
                  <tbody>
                    {history.map((item) => (
                      <tr key={item.id}>
                        <td>#{item.id}</td>
                        <td>{new Date(item.created_at).toLocaleDateString()}</td>
                        <td><span className="badge badge-slate">{item.domain}</span></td>
                        <td><span className="badge badge-slate">{item.difficulty}</span></td>
                        <td>{item.mode}</td>
                        <td>{item.questions_count}</td>
                        <td style={{fontWeight: '700', color: item.total_score >= 7 ? '#6ee7b7' : '#fcd34d'}}>
                          {item.total_score.toFixed(1)} / 10
                        </td>
                        <td>
                          <button className="btn btn-secondary btn-sm" onClick={() => { onSelectInterview(item.id); navigate('result'); }}>
                            View Report
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            ) : (
              <div style={{textAlign: 'center', padding: '20px', color: 'var(--text-muted)', fontSize: '0.8rem'}}>
                No past interview records found.
              </div>
            )}
          </div>
        </div>
      );
    }

    // --- MAIN APP COMPONENT ---
    function App() {
      const [currentPage, setCurrentPage] = useState('home');
      const [user, setUser] = useState(window.api.getUser());
      const [activeInterviewData, setActiveInterviewData] = useState(null);
      const [selectedResultId, setSelectedResultId] = useState(null);

      useEffect(() => {
        const handleAuthChanged = () => {
          setUser(window.api.getUser());
        };
        window.addEventListener('auth-changed', handleAuthChanged);
        return () => window.removeEventListener('auth-changed', handleAuthChanged);
      }, []);

      const handleLogout = () => {
        window.api.clearAuth();
        setUser(null);
        setCurrentPage('home');
      };

      const navigate = (page) => {
        setCurrentPage(page);
        window.scrollTo(0, 0);
      };

      return (
        <div>
          <Navbar currentPage={currentPage} navigate={navigate} user={user} onLogout={handleLogout} />
          
          <main className="app-container">
            {currentPage === 'home' && <HomePage navigate={navigate} user={user} />}
            {currentPage === 'login' && <LoginPage navigate={navigate} onLoginSuccess={() => setUser(window.api.getUser())} />}
            {currentPage === 'register' && <RegisterPage navigate={navigate} onLoginSuccess={() => setUser(window.api.getUser())} />}
            {currentPage === 'dashboard' && <DashboardPage navigate={navigate} onSelectInterview={(id) => setSelectedResultId(id)} />}
            {currentPage === 'setup' && <SetupPage navigate={navigate} onStartInterview={(data) => setActiveInterviewData(data)} />}
            {currentPage === 'interview' && <InterviewPage interviewData={activeInterviewData} navigate={navigate} onCompleteInterview={(id) => setSelectedResultId(id)} />}
            {currentPage === 'result' && <ResultPage interviewId={selectedResultId} navigate={navigate} />}
            {currentPage === 'history' && <HistoryPage navigate={navigate} onSelectInterview={(id) => setSelectedResultId(id)} />}
          </main>
        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
